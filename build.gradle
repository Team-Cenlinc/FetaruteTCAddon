plugins {
    id 'java'
    id 'checkstyle'
    id("com.diffplug.spotless") version "8.2.1"
    id("com.github.spotbugs") version "6.4.8"
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "8.3.11"
    id 'maven-publish'
}

group = 'org.fetarute'
version = '0.0.2'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "bergerkiller-repo"
        url = "https://ci.mg-dev.eu/plugin/repository/everything/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
}

dependencies {
    implementation platform("com.bergerkiller.bukkit:BKCommonLib-bom:${bkCommonLibVersion}")
    implementation("net.kyori:adventure-platform-bukkit:${adventurePlatformVersion}")
    implementation("dev.triumphteam:triumph-gui:${triumphGuiVersion}")
    implementation("com.google.code.gson:gson:2.13.2")
    implementation("com.zaxxer:HikariCP:7.0.2")
    compileOnly("com.github.spotbugs:spotbugs-annotations:4.9.8")
    compileOnly("com.mojang:brigadier:1.0.500")
    compileOnly("io.papermc.paper:paper-api:${paperApiVersion}")
    compileOnly("com.bergerkiller.bukkit:BKCommonLib:${bkCommonLibVersion}")
    compileOnly("com.bergerkiller.bukkit:TrainCarts:${trainCartsVersion}")
    compileOnly("com.bergerkiller.bukkit:TCCoasters:${tccCoastersVersion}")
    compileOnly("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: "org.bukkit", module: "bukkit"
    }
    compileOnly("org.incendo:cloud-paper")
    compileOnly("org.incendo:cloud-minecraft-extras")
    testImplementation("org.incendo:cloud-paper")
    testImplementation("com.mojang:brigadier:1.0.500")
    testImplementation("io.papermc.paper:paper-api:${paperApiVersion}")
    testImplementation("com.bergerkiller.bukkit:BKCommonLib:${bkCommonLibVersion}")
    testImplementation("com.bergerkiller.bukkit:TrainCarts:${trainCartsVersion}")
    testImplementation("com.bergerkiller.bukkit:TCCoasters:${tccCoastersVersion}")
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testImplementation("org.mockito:mockito-core:5.21.0")
    testImplementation("org.mockito:mockito-inline:5.2.0")
    testImplementation("org.xerial:sqlite-jdbc:3.51.2.0")
    // TrainCarts 的可选软依赖会在 Mockito 重转换具体 runtime 类型时被加载；仅补齐测试 JVM。
    testRuntimeOnly("org.apache.logging.log4j:log4j-core:2.24.1")
    testRuntimeOnly("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: "org.bukkit", module: "bukkit"
    }
}

spotless {
    format("misc") {
        target("**/*.md", "**/.gitignore")
        // 独立构建的扩展有自己的构建目录与缓存
        targetExclude("integrations/*/build/**", "integrations/*/.gradle/**", "integrations/*/.kotlin/**")
        trimTrailingWhitespace()
        endWithNewline()
    }
    java {
        target("src/*/java/**/*.java")
        googleJavaFormat("1.17.0")
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = "10.17.0"
    configFile = rootProject.file("config/checkstyle/checkstyle.xml")
}

tasks.withType(org.gradle.api.plugins.quality.Checkstyle).configureEach {
    maxHeapSize = "1g"
}

spotbugs {
    toolVersion = "4.8.6"
    effort = com.github.spotbugs.snom.Effort.MAX
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf("LOW")
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
    enabled = true
    excludeFilter = file("config/spotbugs/exclude.xml")
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion(project.minecraftVersion)
    }
}

tasks.test {
    useJUnitPlatform()
    // Phase 0 的多车场景骨架会在一个 JVM 里连跑多个 700 tick 的完整调度现场，
    // Gradle 默认的 512MB 不够（实测在 Mockito 建 mock 时 OutOfMemoryError）。
    //
    // 2g → 4g（2026-09-15）：骨架接上真实 TrainHealthMonitor 之后，每个
    // smartRecoveryLayer 场景都在驱动完整的生产恢复链，单 tick 的对象量显著上升。
    // 实测 2g 下老年代打满 2047/2048MB、511 次 Full GC，test 任务挂死而非报错——
    // 症状是"没有新的 XML 产出但 CPU 满载"，很容易误判成死循环（我误判过一次）。
    maxHeapSize = "4g"
    // 跨测试类累积是这里的真实成因：JUnit 在类跑完前一直持有实例，而每个骨架实例
    // 都挂着一个完整的 RuntimeDispatchService。定期换 JVM 把累积封顶，
    // 代价是每 40 个类多一次 JVM 启动（约 1 秒）。
    forkEvery = 40
}

def targetJavaVersion = 21
def gitCommitProvider = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
}.standardOutput.asText.map { it.trim() }
def gitCommit = gitCommitProvider.getOrElse("unknown")
def sourceFingerprintFiles = files(
        fileTree("src/main"),
        file("build.gradle"),
        file("gradle.properties")
).files.findAll { it.isFile() }.sort { left, right ->
    rootDir.toPath().relativize(left.toPath()).toString() <=>
            rootDir.toPath().relativize(right.toPath()).toString()
}
def sourceDigest = java.security.MessageDigest.getInstance("SHA-256")
sourceFingerprintFiles.each { sourceFile ->
    def relativePath = rootDir.toPath().relativize(sourceFile.toPath()).toString()
    sourceDigest.update(relativePath.getBytes(java.nio.charset.StandardCharsets.UTF_8))
    sourceDigest.update((byte) 0)
    sourceDigest.update(sourceFile.bytes)
}
def sourceFingerprint = sourceDigest.digest().encodeHex().toString().substring(0, 12)
def buildTimestamp = new Date().format("yyMMdd")
def buildId = "build-${gitCommit}-src-${sourceFingerprint}-${buildTimestamp}"

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }

    // 诊断开关：用 -PlintDeprecation 输出具体的弃用 API 位置（默认不刷屏）。
    if (project.hasProperty("lintDeprecation")) {
        options.compilerArgs.add("-Xlint:deprecation")
    }
    // 诊断开关：用 -PlintUnchecked 输出泛型未检查转换位置（默认不刷屏）。
    if (project.hasProperty("lintUnchecked")) {
        options.compilerArgs.add("-Xlint:unchecked")
    }
}

shadowJar {
    archiveClassifier.set("")
    def commonPrefix = "com.bergerkiller.bukkit.common.dep"
    relocate("cloud.commandframework", "${commonPrefix}.cloud.commandframework")
    relocate("org.incendo.cloud", "${commonPrefix}.cloud")
    relocate("io.leangen.geantyref", "${commonPrefix}.typetoken")
    relocate("me.lucko.commodore", "${commonPrefix}.me.lucko.commodore")
}

tasks.named("build") {
    dependsOn("shadowJar")
}

tasks.named("jar") {
    enabled = false
}

processResources {
    def props = [
            version: version,
            gitCommit: gitCommit,
            sourceFingerprint: sourceFingerprint,
            buildId: buildId
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
    filesMatching('build-info.properties') {
        expand props
    }
}

tasks.named("check") {
    dependsOn("spotlessCheck", "checkstyleMain", "checkstyleTest", "spotbugsMain", "spotbugsTest")
}

// ---- 公开 API 构件 ----
// 只含 org.fetarute.fetaruteTCAddon.api 包（不含 internal 实现），供外部插件 compileOnly 依赖；
// 版本取 FetaruteApi.API_VERSION，与插件版本分开。
def apiVersion = (file("src/main/java/org/fetarute/fetaruteTCAddon/api/FetaruteApi.java").text =~ /API_VERSION = "([^"]+)"/)[0][1]
def apiIncludes = { spec ->
    spec.include("org/fetarute/fetaruteTCAddon/api/**")
    spec.exclude("org/fetarute/fetaruteTCAddon/api/internal/**")
}

tasks.register("apiJar", Jar) {
    group = "build"
    description = "打包公开 API（不含实现）"
    archiveBaseName.set("FetaruteTCAddon-api")
    archiveVersion.set(apiVersion)
    from(sourceSets.main.output) { apiIncludes(it) }
}

tasks.register("apiSourcesJar", Jar) {
    group = "build"
    description = "打包公开 API 源码"
    archiveBaseName.set("FetaruteTCAddon-api")
    archiveVersion.set(apiVersion)
    archiveClassifier.set("sources")
    from(sourceSets.main.allJava) { apiIncludes(it) }
}

tasks.named("build") {
    dependsOn("apiJar", "apiSourcesJar")
}

publishing {
    publications {
        api(MavenPublication) {
            groupId = "org.fetarute"
            artifactId = "fetarute-api"
            version = apiVersion
            artifact(tasks.named("apiJar"))
            artifact(tasks.named("apiSourcesJar"))
            pom {
                name = "FetaruteTCAddon API"
                description = "FetaruteTCAddon 公开 API：调度图、列车、线路、时刻表、驾驶任务与事件"
            }
        }
    }
}

// ---- 官方 Typewriter 扩展 ----
// integrations/typewriter 是独立的 Gradle 工程（自带 wrapper、Kotlin 与 Typewriter 构建插件，Gradle 版本与主工程不同），
// 不能并进主构建，这里调它自己的 gradlew，编译时直接用上面打好的 API jar；产物复制到 build/libs。
// 首次构建要联网取 Typewriter 的构建插件；不需要扩展时加 -PskipTypewriter。
def typewriterDir = file("integrations/typewriter")
def typewriterLibs = layout.buildDirectory.dir("libs")

tasks.register("typewriterExtension", Exec) {
    group = "build"
    description = "构建官方 Typewriter 扩展"
    onlyIf { !project.hasProperty("skipTypewriter") }
    def apiJarFile = tasks.named("apiJar").flatMap { it.archiveFile }
    inputs.file(apiJarFile)
    inputs.files(fileTree(typewriterDir) {
        exclude("build/**", ".gradle/**", ".kotlin/**")
    })
    outputs.dir(new File(typewriterDir, "build/libs"))
    workingDir(typewriterDir)
    def wrapper = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows") ? "gradlew.bat" : "./gradlew"
    def offline = gradle.startParameter.offline
    doFirst {
        def args = [wrapper, "build", "--console=plain", "-PfetaruteApiJar=${apiJarFile.get().asFile.absolutePath}"]
        if (offline) {
            args.add("--offline")
        }
        commandLine(args)
    }
    doLast {
        copy {
            from(new File(typewriterDir, "build/libs"))
            include("*.jar")
            into(typewriterLibs)
        }
    }
}

tasks.named("build") {
    dependsOn("typewriterExtension")
}
