# 配置版本，由插件维护，请勿修改
config-version: 1

# 手动驾驶配置（/fta drive）。
# 缺失或非法的项会回退为内置默认值并在控制台提示；修改后执行 /fta reload 生效，已在进行的驾驶会话保持开始时的参数。

# 是否允许玩家手动驾驶列车（/fta drive）
enabled: true
# 仿真等级：standard / simulation。两级都必须先启动才能牵引，紧急制动停稳后才能缓解，车门没关不能牵引。
# standard 用驾驶台的启动按钮一键启动；simulation 在驾驶台逐项操作开关。
level: standard
# 列车未设置 FTA_TRAIN_MAX_BPS 标签时的最高速度（格/秒）
default-max-speed-bps: 22.0
# 惰行阻力（格/秒²）：列车在动时始终叠加的减速度
coast-drag-bps2: 0.03
# 紧急制动力相对常用制动的倍数（不小于 1）
emergency-multiplier: 1.4
# 牵引/制动力每秒的最大变化量（满力为 1），越小换档越柔和
effort-rate-per-second: 1.5
# 施加紧急制动时牵引/制动力每秒的最大变化量
emergency-rate-per-second: 8.0
# P1、P2、P3 的牵引力占满牵引的比例（递增，不超过 1）
traction-fractions: [0.33, 0.67, 1.0]
# B1–B4 的制动力占常用制动的比例（递增，不超过 1）
brake-fractions: [0.25, 0.5, 0.75, 1.0]
# 动车组加速度预设对应的动车占比；FTA_TRAIN_MT 给出的动车占比低于它时按比例降低加速度
mu-reference-motor-fraction: 0.5
# 机车牵引的加速度预设对应的牵引车厢数；车厢多于它时按比例降低加速度
loco-reference-cars: 6
# 低于该速度（格/秒）视为停稳
stopped-speed-bps: 0.05
# 驾驶员脱离座位后尝试重新入座的时限（tick）
reseat-timeout-ticks: 100
# 按下潜行之后多少 tick 内离座视为主动离座
exit-sneak-window-ticks: 10
# 动作栏刷新间隔（tick）
hud-interval-ticks: 5
# 是否在驾驶员的侧边栏（计分板）显示启动流程、气压、停放制动、制动试验与警惕装置的详细状态。
# 动作栏只保留速度、档位、限速、方向和最要紧的一条提示
sidebar: true
# 创造模式下是否允许驾驶（旁观模式始终不允许）。驾驶期间背包同样只读：创造模式的取物、丢弃都会被截获
allow-creative-mode: true
# 低于该速度（格/秒）的列车视为停着，接管时清掉残余速度；更快的列车视为在溜：
# 顺着驾驶员前进方向溜就沿用当前车速直接接管，朝驾驶室后方溜则提示先停稳
start-max-speed-bps: 0.2
# 是否允许超过限速：true 时 TrainCarts 的限速（牌子或 /train speedlimit 设定）只作提示，
# 超速时动作栏的速度与限速标黄，超出比例达到下面的值则标红；false 时限速是硬上限
speed-limit-override: true
# 超出限速的比例达到该值时标红（0.1 即超出 10%），未达到则标黄
overspeed-red-ratio: 0.1

# 列车未设置 FTA_TRAIN_POWER 标签时的受电方式：
# ptg5（受电弓，5 米接触网）/ ptg6（受电弓，6 米接触网）/ shoe（集电靴，第三轨）/ diesel（内燃）
default-power: ptg5
# 启动流程各步骤耗时（秒）。standard 级用驾驶台的启动按钮一键完成，simulation 级逐项操作
setup-seconds:
  key: 1
  pantograph: 8
  shoe: 2
  engine: 25
  breaker: 3
  aux: 5
# 列车无人驾驶超过多少分钟后按冷车处理（下次上车需重新升弓、合主断）
cold-after-minutes: 10

# simulation 级的车上系统。压力单位为 kPa，standard 级不使用这一段
simulation:
  # 主风缸满压；压缩机充到它就停
  main-reservoir-max-kpa: 900
  # 主风缸低于该压力时压缩机自动启动（动车组自动，机车需打开压缩机开关）
  compressor-cut-in-kpa: 750
  # 压缩机把主风缸从空充到满压所需的秒数
  compressor-fill-seconds: 90
  # 主风缸低于该压力时封锁牵引
  traction-lockout-kpa: 550
  # 主风缸至少要有该压力才能发挥全部常用制动力，低于时按比例下降（紧急制动与停放制动不受影响）
  full-brake-kpa: 450
  # 缓解停放制动所需的主风缸压力
  parking-release-kpa: 450
  # 主风缸跌到该压力以下时停放制动（弹簧制动）自动施加，失风时列车总能停下；不能高于缓解压力
  parking-auto-apply-kpa: 300
  # 常用全制动时的制动缸压力
  brake-cylinder-max-kpa: 350
  # 制动缸每升高 1 kPa 消耗的主风缸压力
  brake-cylinder-consumption: 0.1
  # 无人驾驶时主风缸每分钟的漏泄
  leak-kpa-per-minute: 30
  # 制动试验：制动缸须升到该压力，再缓解到下面的压力以下
  brake-test-apply-kpa: 300
  brake-test-release-kpa: 20
  # 警惕装置：行车中多少秒没有操作（换档或右键）就报警，报警后多少秒不确认就紧急制动
  vigilance-interval-seconds: 60
  vigilance-warning-seconds: 5

# 驾驶调度列车（驾驶员接管带交路、时刻表的列车）。调度照常计算信号与行车许可，驾驶员在许可范围内操纵，
# 超出时车载防护自动制动。任何故障都交还自动运行，不会把列车冻结在原地
driver:
  # 是否允许接管调度列车。改为 false 并执行 /fta reload 后，正在驾驶的调度列车全部在停稳后交还自动运行
  enabled: true
  # 热车交接：接管时受电、主断、辅助电源保持接通，simulation 级的风压满、停放制动已缓解、制动试验视为已做
  hot-handover: true
  # 超过容许速度多少（格/秒）开始自动常用制动
  overspeed-tolerance-bps: 1.0
  # 常用制动介入后，速度降到容许速度以下多少（格/秒）才缓解
  service-release-hysteresis-bps: 0.5
  # 紧急制动线：在常用制动线（容许速度 + 容差）之上再超出容许速度的该比例（不少于容差）时自动紧急制动。
  # 0.15 即再超出 15%。调度要求停车或交还时只用常用制动
  emergency-overspeed-ratio: 0.15
  # 行车许可过期时的限制速度（格/秒）
  restricted-speed-bps: 5.0
  # 调度层多少秒没有发来新的行车许可就按限制速度运行
  directive-stale-seconds: 2
  # 调度层多少秒没有发来新的行车许可就停车并交还自动运行（须大于上一项）
  stale-handback-seconds: 10
  # 停车点前预留的余量（格）：防护按“停车点 − 余量”计算制动曲线
  stop-margin-blocks: 1.0
  # 站停窗口（格）：列车离停车点多近算停准、多近可以开门。停车点是车站牌子的轨道中心（列车中心对准），
  # 股道上有对应节数的停车位置标（stopmark 牌子）时是标志的轨道中心（车头对准）。
  # 网络延迟与服务器 tick 会让同样的操作停偏零点几格，窗口留有余量；停短超出可开门范围须前移。
  # 可开门范围不要超过站台两端富余的长度：列车偏出多少，两端的车门就伸出站台多少
  stop-accurate-blocks: 2.5
  stop-accept-blocks: 6.0
  # 越站：越过停车点超过这么远（格）就算越站——本站不停、不开门，记一次越站，列车继续开往下一站，站台屏显示本站取消。
  # 越过不超过这个距离仍停站开门，按停过头计分。防护的进站曲线最远只许冲到这里
  skip-station-blocks: 12.0
  # 发光停车标：进站时在驾驶员座位该停的地方显示一道发光标线（按停车点、车长与座位位置算出），
  # 只发给驾驶员本人的客户端，其他玩家看不见，不存档；停妥或离开驾驶时撤掉
  stop-marker: true
  # 始发站与车库接班：领了从终点站或车库出发的车次时，派车那一刻先不发车，等驾驶员上车坐进驾驶室并确认座位。
  # 最多等这么久（秒），过时照常按自动运行发车（车库出车的车次仍可在第一个车站接班）
  pickup-wait-seconds: 90
  # 等驾驶员接班时提供“前往列车”：点击后传送到车头驾驶室旁边（不直接坐进座位），只能去自己要接的那列车
  pickup-teleport: true
  # 驾驶座名单：座位附件的名字（在 TrainCarts 附件编辑器里给座位命名）与名单中任一项相同（不区分大小写）即视为驾驶座。
  # 一列车只要有被标记的座位，就只有第一节、最后一节车上被标记的座位算驾驶室；完全没有标记时按车厢位置认定：
  # 前半列车算车头端驾驶室，最后一节算车尾端驾驶室。接管、接车上车与折返换端都按这一判定。写成空列表 [] 表示不认标记
  cab-seat-names: [driver, cab, 驾驶, 驾驶座, 驾驶室]
  # 折返换端：发车方向与驾驶员所坐的一端相反时（终点站折返），驾驶员须自己下车走到另一端的驾驶室坐下，期间列车保持停车、
  # 离座不结束驾驶。时限 = base-seconds + 车身长度 ÷ walk-speed-bps，超时交还自动运行发车，任务记为未完成。
  # 尽头式终点站能提前知道下一趟由车尾端驾驶，接车时直接提示坐哪一节。
  # 这段时间只约束驾驶员，不计入编表的折返停留：自动运行的列车不需要有人走过去
  cab-change:
    # 基础余量（秒）：离座、上车、坐下的时间
    base-seconds: 15
    # 步行速度（格/秒，1 格/秒 = 3.6 km/h）
    walk-speed-bps: 4.0
    # simulation 级：换端开始时距计划发车不少于“换端时限 + 该秒数”时，换端后须重做制动试验；不足时视为已做（热车）。
    # standard 级不做制动试验
    brake-test-seconds: 30
  # 驾驶任务：任务板列出多少分钟内的发车（/fta drive tasks）
  task-window-minutes: 20
  # 一次任务的绝对上限（分钟），超过即停车交还并判未完成
  max-task-minutes: 90
  # ATO 下停站结束后等驾驶员右键确认发车的上限（秒），超时自动发车
  ato-confirm-seconds: 15
  # 卡住的时间阶梯（秒，须依次递增）：列车能走却不走（表定停站、调度扣车不算）累计到各档时，
  # 依次告警、转 ATO、交还自动运行并判任务未完成、把驾驶员送到最近车站的站台
  rescue-warn-seconds: 60
  rescue-ato-seconds: 120
  rescue-handback-seconds: 180
  rescue-teleport-seconds: 300
  # 拥堵熔断：全网被扣住超过 breaker-held-seconds 秒的车达到 breaker-held-trains 列、且阻挡链里有驾驶员列车时，
  # 交还全部驾驶员列车，并在 breaker-cooldown-minutes 分钟内暂停接班（/fta drive breaker reset 可提前解除）
  breaker-held-trains: 5
  breaker-held-seconds: 60
  breaker-cooldown-minutes: 15
