# 内置文案改写前的旧值（见 zh_CN.yml 的说明）。服务器上的 lang/en_US.yml 里某个键仍是这里列出的旧值之一时，加载时换成新的内置文案。
drive:
  license:
    exam:
      brief:
        road-test:
          how: ["<prefix> <white>How: </white><gray>when the train arrives, sit in the leading cab, confirm your seat and run <aqua>/fta drive on</aqua>.</gray> <click:run_command:'/fta drive task goto'><hover:show_text:'<gray>Teleport next to the train</gray>'><green>[Go to train]</green></hover></click>", "<prefix> <white>How: </white><gray>when the train arrives, sit in the leading cab, confirm your seat and run <aqua>/fta drive on</aqua>.</gray> <click:run_command:'/fta drive task goto'><hover:show_text:'<gray>Teleport to the boarding platform; if the train is already in, right beside the front cab</gray>'><green>[Go to boarding]</green></hover></click>", "<prefix> <white>How: </white><gray>when the train arrives, sit in the leading cab, confirm your seat and run <aqua>/fta drive on</aqua>.</gray> <click:run_command:'/fta drive task goto'><hover:show_text:'<gray>Teleport to the boarding platform; if the train is already in, right beside the leading cab</gray>'><green>[Go to takeover]</green></hover></click>"]
          route: ["<prefix> <white>Trip <aqua><trip></aqua>: take over at <yellow><board></yellow>, drive <stops> stops and finish at <yellow><alight></yellow>.</white>", "<prefix> <white>Trip <aqua><trip></aqua>: take over at <yellow><board></yellow>, drive <stops> stops and hand over at <yellow><alight></yellow>.</white>"]
      stop:
        outcome:
          accepted: ["<green>within door range</green>"]
          short: ["<yellow>short</yellow>"]
          overrun: ["<red>overran</red>"]
        line: ["<prefix> <gray>Road test <done>/<total></gray> <white><station></white> <window><doors>"]
      reason:
        not-completed: ["you did not reach the final station"]
      tip:
        not-completed: ["<prefix> <gray>Tip: the exam completes once you stop at the final station and open the doors; leaving your seat, abandoning or getting stuck ends it.</gray>"]
      warn:
        hint: ["<prefix> <gray>You may keep driving to the final station for practice, or end the exam with /fta drive task abandon.</gray>"]
    coach:
      side:
        both: ["both"]
      approach: ["<prefix> <aqua>Coach:</aqua> <gray>Approaching <white><station></white>. Watch the stop-point distance in the sidebar, brake early and ease off as you get close.</gray>"]
      open-doors: ["<prefix> <aqua>Coach:</aqua> <gray>Stopped. Press F for the cab menu and open the <white><side></white> doors.</gray>"]
      depart: ["<prefix> <aqua>Coach:</aqua> <gray>Clear to depart. Start smoothly in P1, then follow the advisory speed in the boss bar.</gray>"]
    info:
      level-closed: ["  <dark_gray>○ Level <level> · <name> (not open)</dark_gray>"]
    card:
      notice: ["<black>Valid on every server for every FTCA train.</black>\n\n<dark_gray>Driving permission follows the system record; this book is only a certificate. Lost it? Run /fta license reissue.\n\nLevels and exams: /fta license</dark_gray>"]
    practice:
      brief:
        drill: ["<prefix> <white>Incident drill:</white><gray> after the first stop, one incident is simulated at random (line power loss, door fault, obstacle ahead…). Follow the prompts; it is reviewed at the end and does not affect the practice count.</gray>"]
        feedback: ["<prefix> <gray>Each stop is reviewed. Reaching the final station counts as one practice run; if the trip runs late, the drill is cancelled first and the train may be handed back to automatic operation.</gray>"]
        route: ["<prefix> <white>Practice trip <aqua><trip></aqua>: take over at <yellow><board></yellow>, drive through <stops> stops and finish at <yellow><alight></yellow>.</white>", "<prefix> <white>Practice trip <aqua><trip></aqua>: take over at <yellow><board></yellow>, drive through <stops> stops and hand over at <yellow><alight></yellow>.</white>"]
      warn:
        hint: ["<prefix> <gray>Keep driving to the final station; you will get a review at the end.</gray>"]
      review:
        not-counted: ["<prefix> <yellow>You did not reach the final station, so this run does not count.</yellow>"]
      stop:
        line: ["<prefix> <gray>Practice <done>/<total></gray> <white><station></white> <window><doors>"]
    drill:
      start:
        line-loss: ["<prefix> <red>Line power lost: traction is unavailable.</red> <gray>Return to N or brake, do not keep notching up; power returns in about <seconds> s.</gray>"]
        door: ["<prefix> <red>Door fault: the doors-closed circuit is open and traction is blocked.</red> <gray>Make sure every door is closed, then press F and switch on the door bypass.</gray>"]
      done:
        line-loss: ["<prefix> <green>Power restored; you may notch up again.</green> <gray>Reaction time <seconds> s.</gray>"]
      tip:
        line-loss: ["<prefix> <gray>Tip: on line power loss, return to N or brake at once instead of holding traction; move off again once power returns.</gray>"]
        breaker-trip: ["<prefix> <gray>Tip: on a breaker trip, return to N, then open and close the main breaker in the cab menu; notch up only once it has closed.</gray>"]
      name:
        line-loss: ["line power loss"]
  handbook:
    driver:
      page-4: ["<dark_blue><bold>3. Tasks and taking over</bold></dark_blue>\n<black>At a station run /fta drive tasks: left-click for manual, right-click for ATO. When the train arrives, sit in the leading cab, confirm your seat and run /fta drive on.</black>"]
      page-9: ["<dark_blue><bold>8. Termini and changing ends</bold></dark_blue>\n<black>At the terminus the trip is scored once the doors open; you may end driving or carry on with this train's next trip.\nTo change ends, leave the doors open and walk to the other cab; unmarked cab seats must be confirmed.</black>"]
      page-3: ["<dark_blue><bold>2. Licences</bold></dark_blue>\n<black>Level 1 free licence: complete the tutorial; drive non-dispatched trains.\nLevel 2 dispatch licence: practise, then pass a road test; take tasks on dispatched trains.\nLicences are valid everywhere.</black>\n<dark_gray>See and sign up: /fta license</dark_gray>"]
      page-7: ["<dark_blue><bold>6. Stopping and doors</bold></dark_blue>\n<black>The sidebar shows metres to the stop mark. Brake early; stopping within the door range passes, an accurate stop is better; move up if short, you cannot reverse after overrunning.\nOnce stopped press F, open the platform side, close when the dwell ends.</black>", "<dark_blue><bold>6. Stopping and doors</bold></dark_blue>\n<black>The sidebar shows metres to the stop mark. Brake early; stopping within the door range passes, an accurate stop is better; move up if short, you cannot reverse after overrunning. At terminals you may overrun the stop mark by 3 m at most, or the train is forcibly stopped.\nOnce stopped press F, open the platform side, close when the dwell ends.</black>"]
      page-5: ["<dark_blue><bold>4. The cab</bold></dark_blue>\n<black>Hotbar 1–3 power P3–P1, 4 coast N, 5–8 brake B1–B4, 9 emergency EB.\nOnce stopped, F opens the cab menu (doors, end driving).\nAction bar: speed and limit.\nSidebar: signal, stop, times, doors.</black>"]
      page-10: ["<dark_blue><bold>9. When things go wrong</bold></dark_blue>\n<black>If dispatch holds you, wait for the signal. Use the emergency brake only when you must stop at once. Leaving your seat ends driving; hand back to automatic operation if stuck.</black>\n<dark_gray>Full handbook: Fetarute Wiki.</dark_gray>"]
  task:
    board:
      no-station: ["<prefix> <red>No station nearby; open the task board near a platform</red>"]
      entry-claimed-self: ["<gray>Taken by you</gray>"]
      info-claimed: ["<gray>Grey trips are already taken by a driver</gray>"]
    claim:
      claimed: ["<prefix> <green>Took trip <white><route></white> <aqua><trip></aqua>: sit in the leading cab when the train arrives</green>"]
      protection-active: ["<prefix> <red>The line is congested; new shifts are paused</red>"]
      assigned-interval: ["<prefix> <green>New driving task: <white><route></white> <aqua><trip></aqua>; take over at <white><station></white> and drive to <white><alight></white></green>"]
    pickup:
      terminal: ["<prefix> <white>Trip <aqua><trip></aqua> runs with train <aqua><train></aqua>, standing at <location>. Board within <yellow><seconds></yellow> s, sit in the cab at either end and confirm your seat; if the train reverses you will be moved to the leading cab</white>"]
      depot: ["<prefix> <white>Train <aqua><train></aqua> for trip <aqua><trip></aqua> has left the depot shed at <location> and is waiting on its track. Sit in the leading cab and confirm your seat within <yellow><seconds></yellow> s</white>"]
    goto:
      teleported: ["<prefix> <green>You are next to the train's leading cab; board, sit down and confirm your seat</green>"]
      station: ["<prefix> <green>You are at the boarding platform. Wait for the train, sit in the front cab and confirm your seat to take over</green>"]
      station-missing: ["<prefix> <red>Cannot find the boarding platform; please go there yourself</red>"]
      station-pending: ["<prefix> <gray>Heading to the boarding platform…</gray>"]
    cab-changed: ["<prefix> <white>Changed ends: you are now in the leading cab (car <car>)</white>"]
    cab-change-failed: ["<prefix> <red>Could not change ends: no free seat in the leading cab, the train returns to automatic operation</red>"]
    cab-change:
      announce: ["<prefix> <white>The train reverses here: the next trip is driven from the cab in car <yellow><car></yellow>. Take that seat before departure; leaving your seat on the way does not end driving</white>"]
    continue-offer: ["<prefix> <white>This trip is scored. The train continues as trip <aqua><trip></aqua> to <yellow><destination></yellow>, departing at <white><time></white>; you may keep driving, and the next trip is scored on its own</white> <click:run_command:'/fta drive off'><hover:show_text:'<gray>Click to run:</gray> <white>/fta drive off</white>'><red>[End driving]</red></hover></click>"]
    continue-offer-code: ["<prefix> <white>This trip is scored. The train continues as trip <aqua><trip></aqua>, departing at <white><time></white>; you may keep driving, and the next trip is scored on its own</white> <click:run_command:'/fta drive off'><hover:show_text:'<gray>Click to run:</gray> <white>/fta drive off</white>'><red>[End driving]</red></hover></click>"]
    sheet:
      result:
        accepted: ["<yellow><offset> · within door window</yellow>"]
        overrun: ["<red><offset> · outside the window</red>"]
        short: ["<red><offset> · short, timed out</red>"]
