      abandoned: ["Abandoned"]
    next-trip-layover: ["<prefix> <white>This train is laying over; its next trip is <aqua><trip></aqua> to <yellow><destination></yellow>, departing at <white><time></white></white>"]
    next-trip-layover-no-destination: ["<prefix> <white>This train is laying over; its next trip is <aqua><trip></aqua>, departing at <white><time></white></white>"]
