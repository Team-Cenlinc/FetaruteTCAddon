# 内置文案改写前的旧值（见 zh_CN.yml 的说明）。服务器上的 lang/en_US.yml 里某个键仍是这里列出的旧值之一时，加载时换成新的内置文案。
drive:
  task:
    board:
      no-station: ["<prefix> <red>No station nearby; open the task board near a platform</red>"]
    claim:
      claimed: ["<prefix> <green>Took trip <white><route></white> <aqua><trip></aqua>: sit in the leading cab when the train arrives</green>"]
  hud:
    line:
      - "<gray>Speed</gray> <white><speed_kmh></white> <gray>km/h</gray> <dark_gray>|</dark_gray> <gray>Notch</gray> <yellow><notch></yellow> <dark_gray>|</dark_gray> <gray>Limit</gray> <white><limit_kmh></white> <dark_gray>|</dark_gray> <aqua><direction></aqua>"
      - "<gray>Speed</gray> <speed> <gray>km/h</gray> <dark_gray>|</dark_gray> <gray>Notch</gray> <yellow><notch></yellow> <force> <dark_gray>|</dark_gray> <gray>Limit</gray> <limit> <dark_gray>|</dark_gray> <aqua><direction></aqua>"
    station:
      approach: ["<aqua><station></aqua> <gray>stop mark</gray> <white><distance></white> <gray>blocks</gray>"]
      move-up: ["<yellow>Move up <white><distance></white> blocks to the stop mark</yellow>"]
      overrun: ["<red>Past the stop mark by <white><distance></white> blocks</red>"]
  sidebar:
    value:
      stop:
        approach: ["<aqua><station></aqua> <white><distance></white> <gray>blocks</gray>"]
        move-up: ["<yellow>Move up <white><distance></white> blocks</yellow>"]
        overrun: ["<red>Overran by <white><distance></white> blocks</red>"]
  command:
    help:
      entry-task: ["  <gray>•</gray> <white>/fta drive task [status|abandon]</white> <gray>- Show or abandon your task</gray>"]
      entry-tasks: ["  <gray>•</gray> <white>/fta drive tasks</white> <gray>- Open the task board of the nearest station</gray>"]
    start:
      bad-game-mode: ["<prefix> <red>Only survival or adventure mode can drive</red>"]
      managed-train: ["<prefix> <red>This train is managed by the dispatcher and cannot be driven manually yet</red>"]
      train-moving:
        - "<prefix> <red>The train is moving, wait until it has stopped</red>"
        - "<prefix> <red>The train has not stopped (<white><speed_kmh></white> km/h), wait until it has stopped</red>"
