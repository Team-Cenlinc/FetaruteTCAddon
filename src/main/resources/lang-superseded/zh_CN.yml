# 内置文案改写前的旧值。服务器上的 lang/zh_CN.yml 里某个键仍是这里列出的旧值之一（没有改过）时，
# 加载时换成新的内置文案；改过的保留。只列改写过的键：新增的键会自动补上，不用列。
command:
  pids:
    help:
      give: ["<gray>/fta pids give <white><布局></white></gray> <white>-</white> <dark_aqua>领取安装纸（platform-1x3、platform-1x4、platform-2x1 停站屏、station-3x5 或自定义布局）</dark_aqua>"]
  train:
    help:
      entry-config-set:
        - "  <gray>•</gray> <white>/fta train config set [列车] --type/--accel/--decel</white> <gray>- 设置配置</gray>"
        - "  <gray>•</gray> <white>/fta train config set [列车] --type/--accel/--decel/--mode/--mt/--max-speed</white> <gray>- 设置配置</gray>"
    config:
      drive-set: ["<prefix> 列车 <dark_aqua><train></dark_aqua> 驾驶参数已更新: mode=<white><mode></white> mt=<white><mt></white> max=<white><max></white>"]
      drive-list: ["  <gray>驾驶:</gray> mode=<white><mode></white> mt=<white><mt></white> max=<white><max></white> <gray>bps</gray>"]
pids:
  board:
    notice:
      order:
        title-secondary: ["Off first, then on"]
        body: ["请让乘客先下车"]
        body-secondary: ["Let passengers off first"]
      queue:
        title-secondary: ["Please queue"]
        body: ["请勿拥挤，有序上车"]
        body-secondary: ["No pushing, board in order"]
      doors:
        body-secondary: ["Do not rush as the doors close"]
      passing:
        body: ["请勿靠近站台边缘"]
        body-secondary: ["Stand clear of the platform edge"]
drive:
  task:
    board:
      no-station: ["<prefix> <red>附近没有车站，请到车站站台附近再打开任务板</red>"]
      entry-time: ["<gray>计划发车</gray> <white><time></white>"]
      entry-platform: ["<gray>站台</gray> <white><platform></white>"]
      entry-train: ["<gray>列车</gray> <white><train></white>"]
    claim:
      claimed: ["<prefix> <green>已领取车次 <white><route></white> <aqua><trip></aqua>：列车到站后坐进车头驾驶室即可接班</green>"]
  hud:
    line:
      - "<gray>速度</gray> <white><speed_kmh></white> <gray>km/h</gray> <dark_gray>|</dark_gray> <gray>档位</gray> <yellow><notch></yellow> <dark_gray>|</dark_gray> <gray>限速</gray> <white><limit_kmh></white> <dark_gray>|</dark_gray> <aqua><direction></aqua>"
      - "<gray>速度</gray> <speed> <gray>km/h</gray> <dark_gray>|</dark_gray> <gray>档位</gray> <yellow><notch></yellow> <force> <dark_gray>|</dark_gray> <gray>限速</gray> <limit> <dark_gray>|</dark_gray> <aqua><direction></aqua>"
    station:
      approach: ["<aqua><station></aqua> <gray>停车点</gray> <white><distance></white> <gray>格</gray>"]
      move-up: ["<yellow>请前移 <white><distance></white> 格对标</yellow>"]
      overrun: ["<red>越过停车点 <white><distance></white> 格</red>"]
  sidebar:
    value:
      stop:
        approach: ["<aqua><station></aqua> <white><distance></white> <gray>格</gray>"]
        move-up: ["<yellow>请前移 <white><distance></white> 格</yellow>"]
        overrun: ["<red>越过 <white><distance></white> 格</red>"]
  command:
    help:
      entry-task: ["  <gray>•</gray> <white>/fta drive task [status|abandon]</white> <gray>- 查看或放弃当前任务</gray>"]
      entry-tasks: ["  <gray>•</gray> <white>/fta drive tasks</white> <gray>- 打开最近车站的任务板，领取车次</gray>"]
    start:
      bad-game-mode: ["<prefix> <red>只有生存或冒险模式可以驾驶</red>"]
      managed-train: ["<prefix> <red>该列车由调度系统管理，暂不支持手动驾驶</red>"]
      train-moving:
        - "<prefix> <red>列车正在行驶，停稳后才能开始驾驶</red>"
        - "<prefix> <red>列车尚未停稳（当前 <white><speed_kmh></white> km/h），停稳后才能开始驾驶</red>"
