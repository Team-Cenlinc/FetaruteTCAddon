bossbar:
  template: |-
    rotate_ticks: 60
    DEFAULT_1: <{line_color_tag}>█<white> {line}</white> █</{line_color_tag}> <dark_gray>┃</dark_gray> <white>{train_name}</white> <dark_gray>┃</dark_gray> <white>开往 {dest_eop}</white>
    DEFAULT_2: <{line_color_tag}>█<white> {line_lang2}</white> █</{line_color_tag}> <dark_gray>┃</dark_gray> <white>{train_name}</white> <dark_gray>┃</dark_gray> <white>To {dest_eop_lang2}</white>
    AT_LAST_STATION_1: <gold>◆━━━━━</gold> <white>终点站</white> <yellow>{current_station}</yellow> <white>到了</white> <gold>━━━━━◆</gold>
    AT_LAST_STATION_2: <gold>◆━━━━━</gold> <white>Final stop</white> <yellow>{current_station_lang2}</yellow> <gold>━━━━━◆</gold>
    TERM_ARRIVING_1: <gold>◇━━</gold> <white>终点</white> <yellow>{next_station}</yellow> <white>即将到达</white> <gold>━━◇</gold>
    TERM_ARRIVING_2: <gold>◇━━</gold> <white>Terminal</white> <yellow>{next_station_lang2}</yellow> <white>arriving</white> <gold>━━◇</gold>
    IN_TRIP_1: <{line_color_tag}>█</{line_color_tag}> <white>{line}</white> <dark_gray>┃</dark_gray> <{signal_color_tag}>⬤</{signal_color_tag}> <white>{speed}</white> <dark_gray>┃</dark_gray> <gray>车厢 ⟨</gray><white>{player_carriage_no}</white><gray>/</gray><white>{player_carriage_total}</white><gray>⟩</gray>
    IN_TRIP_2: <{line_color_tag}>█</{line_color_tag}> <white>{line_lang2}</white> <dark_gray>┃</dark_gray> <{signal_color_tag}>⬤</{signal_color_tag}> <white>{speed}</white> <dark_gray>┃</dark_gray> <gray>Car. ⟨</gray><white>{player_carriage_no}</white><gray>/</gray><white>{player_carriage_total}</white><gray>⟩</gray>
    ON_LAYOVER_1: <aqua>◈━━</aqua> <gray>等待新行程</gray> <aqua>━━◈</aqua>
    ON_LAYOVER_2: <aqua>◈━━</aqua> <gray>Preparing for new trip</gray> <aqua>━━◈</aqua>
    IDLE_1: <{signal_color_tag}>⬤</{signal_color_tag}> <white>临时停车</white> <dark_gray>━</dark_gray> <gray>等待信号中...</gray>
    IDLE_2: <{signal_color_tag}>⬤</{signal_color_tag}> <white>Holding</white> <dark_gray>━</dark_gray> <gray>Waiting for signal...</gray>
    OUT_OF_SERVICE_1: <{line_color_tag}>█<white> {line}</white> █</{line_color_tag}> <dark_gray>┃</dark_gray> <white>{train_name}</white> <dark_gray>┃</dark_gray> <white>回库</white>
    OUT_OF_SERVICE_2: <{line_color_tag}>█<white> {line_lang2}</white> █</{line_color_tag}> <dark_gray>┃</dark_gray> <white>{train_name}</white> <dark_gray>┃</dark_gray> <white>Not in Service</white>
actionbar:
  template: |-
    rotate_ticks: 60
    AT_STATION_1: <dark_gray>◉</dark_gray> <white>本站</white> <yellow>{current_station}</yellow> <dark_gray>┃</dark_gray> <white>下一站</white> <yellow>{next_station}</yellow>
    AT_STATION_2: <dark_gray>◉</dark_gray> <white>Now at</white> <yellow>{current_station_lang2}</yellow> <dark_gray>┃</dark_gray> <white>Next</white> <yellow>{next_station_lang2}</yellow>
    AT_LAST_STATION_1: <gold>◆━━</gold> <yellow>终点站 {current_station} 到了</yellow> <gold>━━◆</gold> <gray>请全体乘客下车</gray>
    AT_LAST_STATION_2: <gold>◆━━</gold> <yellow>Final stop {current_station_lang2}</yellow> <gold>━━◆</gold>
    DEPARTING_1: <aqua>▶</aqua> <white>欢迎乘坐</white> <aqua>{operator}</aqua> <dark_gray>┃</dark_gray> <white>{line}</white> <white>列车</white>
    DEPARTING_2: <aqua>▶</aqua> <white>本次列车开往</white> <yellow>{dest_eop}</yellow>
    DEPARTING_3: <aqua>▶</aqua> <white>Welcome aboard</white> <aqua>{operator}</aqua> <dark_gray>┃</dark_gray> <yellow>{line}</yellow> <white>to</white> <yellow>{dest_eop_lang2}</yellow>
    IN_TRIP_1: <white>下一站</white> <yellow>{next_station}</yellow> <dark_gray>┃</dark_gray> <gray>约</gray> <aqua>{eta_minutes}</aqua> <gray>分钟</gray>
    IN_TRIP_2: <white>Next</white> <yellow>{next_station_lang2}</yellow> <dark_gray>┃</dark_gray> <gray>ETA: </gray><aqua>{eta_minutes}</aqua><gray>min</gray>
    IN_TRIP_3: <white>下一站</white> <yellow>{next_station}</yellow> <dark_gray>┃</dark_gray> <white>可换乘</white> {?transfer_lines}
    IN_TRIP_4: <white>Next</white> <yellow>{next_station_lang2}</yellow> <dark_gray>┃</dark_gray> <white>Change for</white> {?transfer_lines}
    IN_TRIP_5: <white>下一站</white> <yellow>{next_station}</yellow> <dark_gray>┃</dark_gray> <gold>晚点约 {?delay_minutes} 分钟</gold>
    IN_TRIP_6: <white>Next</white> <yellow>{next_station_lang2}</yellow> <dark_gray>┃</dark_gray> <gold>Delayed by {?delay_minutes} min</gold>
    IN_TRIP_7: <aqua>⇄</aqua> <white>本列车在</white> <yellow>{?through_station}</yellow> <white>起改为</white> <{through_line_color_tag}>█</{through_line_color_tag}><white>{through_line}</white> <white>运行</white>
    IN_TRIP_8: <aqua>⇄</aqua> <white>From</white> <yellow>{?through_station_lang2}</yellow> <white>this train runs as</white> <{through_line_color_tag}>█</{through_line_color_tag}><white>{through_line_lang2}</white>
    IN_TRIP_9: <aqua>▶</aqua> <white>按</white> <yellow>{?trip_dialog_key}</yellow> <white>查看后续站点</white>
    IN_TRIP_10: <aqua>▶</aqua> <white>Press</white> <yellow>{?trip_dialog_key}</yellow> <white>for upcoming stops</white>
    ARRIVING_1: <green>▼</green> <yellow>{next_station}</yellow> <white>到了</white> <dark_gray>━</dark_gray> <gray>下车请注意安全</gray>
    ARRIVING_2: <green>▼</green> <white>Now arriving at</white> <yellow>{next_station_lang2}</yellow> <dark_gray>━</dark_gray> <gray>Mind the gap</gray>
    ARRIVING_3: <green>▼</green> <yellow>{next_station}</yellow> <white>到了</white> <dark_gray>━</dark_gray> <white>可换乘</white> {?transfer_lines}
    ARRIVING_4: <green>▼</green> <white>Now arriving at</white> <yellow>{next_station_lang2}</yellow> <dark_gray>━</dark_gray> <white>Change for</white> {?transfer_lines}
    TERM_ARRIVING_1: <gold>◆</gold> <yellow>终点站 {next_station} 到了</yellow> <gold>◆</gold> <gray>感谢乘坐</gray>
    TERM_ARRIVING_2: <gold>◆</gold> <yellow>Final stop</yellow> <gold>◆</gold> <gray>Thank you for travelling with {operator}</gray>
    TERM_ARRIVING_3: <gold>◆</gold> <yellow>终点站 {next_station} 到了</yellow> <dark_gray>━</dark_gray> <white>可换乘</white> {?transfer_lines}
    TERM_ARRIVING_4: <gold>◆</gold> <yellow>Final stop</yellow> <dark_gray>━</dark_gray> <white>Change for</white> {?transfer_lines}
    ON_LAYOVER_1: <aqua>◈</aqua> <gray>等待新行程</gray> <aqua>◈</aqua>
    ON_LAYOVER_2: <aqua>◈</aqua> <gray>Preparing for new trip</gray> <aqua>◈</aqua>
    IDLE_1: <{signal_color_tag}>⬤</{signal_color_tag}> <white>临时停车</white> <dark_gray>━</dark_gray> <gray>等待信号中...</gray>
    IDLE_2: <{signal_color_tag}>⬤</{signal_color_tag}> <white>Holding</white> <dark_gray>━</dark_gray> <gray>Waiting for signal...</gray>
    OUT_OF_SERVICE_1: <gray>◈━━</gray> <white>本列车回库，不再载客</white> <gray>━━◈</gray>
    OUT_OF_SERVICE_2: <gray>◈━━</gray> <white>Not in Service</white> <gray>━━◈</gray>
player_display:
  template: |-
    lines: 15
    page_duration_ticks: 80
    max_width: 120
    pages:
      DEFAULT_1:
        title: "<{line_color_tag}>█</{line_color_tag}> <white>{line}</white> <{line_color_tag}>█</{line_color_tag}>"
        kind: list_page
        source: next_stops
        limit: 15
        header:
          - "<gray>█</gray> <white>开往 {dest_eop}</white>"
          - "<gray>█</gray> <yellow>{route_pattern_zh_CN}</yellow>"
        row:
          - "<{line_color_tag}>◘</{line_color_tag}> <white>{index} - {station}</white>"
          - "<{line_color_tag}>█</{line_color_tag}> <gray>{eta_status_zh_CN}</gray>"
        window:
          size: 3
          step: 3
          fixed: 3
          mode: chunk
          periodTicks: 40
          resetOnStop: true
        footer:
          - "<gray>█</gray> <white>时间：{time_hhmmss}</white>"

      DEFAULT_2:
        title: "<{line_color_tag}>█</{line_color_tag}> <white>{line_lang2}</white> <{line_color_tag}>█</{line_color_tag}>"
        kind: list_page
        source: next_stops
        limit: 15
        header:
          - "<gray>█</gray> <white>To {dest_eop_lang2}</white>"
          - "<gray>█</gray> <yellow>{route_pattern_en_US}</yellow>"
        row:
          - "<{line_color_tag}>◘</{line_color_tag}> <white>{index} - {station_lang2}</white>"
          - "<{line_color_tag}>█</{line_color_tag}> <gray>{eta_status_en_US}</gray>"
        window:
          size: 3
          step: 3
          fixed: 3
          mode: chunk
          periodTicks: 40
          resetOnStop: true
        footer:
          - "<gray>█</gray> <white>Time: {time_hhmmss}</white>"

      OUT_OF_SERVICE_1:
        title: "<{line_color_tag}>█</{line_color_tag}> <white>{line}</white> <{line_color_tag}>█</{line_color_tag}>"
        kind: static
        lines:
          - "<gray>█</gray> <white>回库</white>"
          - "<gray>█</gray> <gray>本列车不再载客</gray>"
          - "<gray>█</gray> <white>时间：{time_hhmmss}</white>"

      OUT_OF_SERVICE_2:
        title: "<{line_color_tag}>█</{line_color_tag}> <white>{line_lang2}</white> <{line_color_tag}>█</{line_color_tag}>"
        kind: static
        lines:
          - "<gray>█</gray> <white>Not in Service</white>"
          - "<gray>█</gray> <gray>No passengers</gray>"
          - "<gray>█</gray> <white>Time: {time_hhmmss}</white>"
