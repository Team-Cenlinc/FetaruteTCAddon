bossbar:
  template: |-
    rotate_ticks: 60
    DEFAULT_1: <{line_color_tag}>█<white> {line}</white> █</{line_color_tag}> <dark_gray>┃</dark_gray> <white>{train_name}</white> <dark_gray>┃</dark_gray> <white>开往 {dest_eop}</white>
    DEFAULT_2: <{line_color_tag}>█<white> {line_lang2}</white> █</{line_color_tag}> <dark_gray>┃</dark_gray> <white>{train_name}</white> <dark_gray>┃</dark_gray> <white>To {dest_eop_lang2}</white>
    AT_LAST_STATION_1: <gold>◆━━━━━</gold> <white>终点站</white> <yellow>{current_station}</yellow> <white>到了</white> <gold>━━━━━◆</gold>
    AT_LAST_STATION_2: <gold>◆━━━━━</gold> <white>Final stop</white> <yellow>{current_station_lang2}</yellow> <gold>━━━━━◆</gold>
    TERM_ARRIVING_1: <gold>◇━━</gold> <white>终点</white> <yellow>{next_station}</yellow> <white>即将到达</white> <gold>━━◇</gold>
    TERM_ARRIVING_2: <gold>◇━━</gold> <white>Terminal</white> <yellow>{next_station_lang2}</yellow> <white>arriving</white> <gold>━━◇</gold>
    JOIN_ARRIVING_1: <aqua>◇━━</aqua> <white>下一站</white> <yellow>{next_station}</yellow> <dark_gray>┃</dark_gray> <white>本列车在该站联挂后开往</white> <yellow>{dest_eop}</yellow> <aqua>━━◇</aqua>
    JOIN_ARRIVING_2: <aqua>◇━━</aqua> <white>Next:</white> <yellow>{next_station_lang2}</yellow> <dark_gray>┃</dark_gray> <white>The train joins another there and continues to</white> <yellow>{dest_eop_lang2}</yellow> <aqua>━━◇</aqua>
    AT_JOIN_STATION_1: <aqua>◆━━</aqua> <yellow>{current_station}</yellow> <white>到了</white> <dark_gray>┃</dark_gray> <white>本列车在本站联挂后开往</white> <yellow>{dest_eop}</yellow> <aqua>━━◆</aqua>
    AT_JOIN_STATION_2: <aqua>◆━━</aqua> <yellow>{current_station_lang2}</yellow> <dark_gray>┃</dark_gray> <white>The train joins another here and continues to</white> <yellow>{dest_eop_lang2}</yellow> <aqua>━━◆</aqua>
    DIVIDE_ARRIVING_1: <aqua>◇━━</aqua> <white>下一站</white> <yellow>{next_station}</yellow> <dark_gray>┃</dark_gray> <white>本站分行，本节车厢开往</white> <yellow>{car_destination}</yellow> <aqua>━━◇</aqua>
    DIVIDE_ARRIVING_2: <aqua>◇━━</aqua> <white>Next:</white> <yellow>{next_station_lang2}</yellow> <dark_gray>┃</dark_gray> <white>The train divides there; this car continues to</white> <yellow>{car_destination_lang2}</yellow> <aqua>━━◇</aqua>
    AT_DIVIDE_STATION_1: <aqua>◆━━</aqua> <yellow>{current_station}</yellow> <white>到了</white> <dark_gray>┃</dark_gray> <white>本站分行，本节车厢开往</white> <yellow>{car_destination}</yellow> <aqua>━━◆</aqua>
    AT_DIVIDE_STATION_2: <aqua>◆━━</aqua> <yellow>{current_station_lang2}</yellow> <dark_gray>┃</dark_gray> <white>The train divides here; this car continues to</white> <yellow>{car_destination_lang2}</yellow> <aqua>━━◆</aqua>
    CAR_ENDS_ARRIVING_1: <gold>◇━━</gold> <white>本节车厢终点</white> <yellow>{next_station}</yellow> <white>即将到达</white> <gold>━━◇</gold>
    CAR_ENDS_ARRIVING_2: <gold>◇━━</gold> <white>This car terminates at</white> <yellow>{next_station_lang2}</yellow> <gold>━━◇</gold>
    AT_CAR_END_1: <gold>◆━━</gold> <yellow>{current_station}</yellow> <white>到了</white> <dark_gray>┃</dark_gray> <white>本节车厢在本站止，请下车</white> <gold>━━◆</gold>
    AT_CAR_END_2: <gold>◆━━</gold> <yellow>{current_station_lang2}</yellow> <dark_gray>┃</dark_gray> <white>This car terminates here. Please alight</white> <gold>━━◆</gold>
    IN_TRIP_1: <{line_color_tag}>█</{line_color_tag}> <white>{line}</white> <dark_gray>┃</dark_gray> <{signal_color_tag}>⬤</{signal_color_tag}> <white>{speed}</white> <dark_gray>┃</dark_gray> <gray>车厢 ⟨</gray><white>{player_carriage_no}</white><gray>/</gray><white>{player_carriage_total}</white><gray>⟩</gray>
    IN_TRIP_2: <{line_color_tag}>█</{line_color_tag}> <white>{line_lang2}</white> <dark_gray>┃</dark_gray> <{signal_color_tag}>⬤</{signal_color_tag}> <white>{speed}</white> <dark_gray>┃</dark_gray> <gray>Car. ⟨</gray><white>{player_carriage_no}</white><gray>/</gray><white>{player_carriage_total}</white><gray>⟩</gray>
    IN_TRIP_3: <gold>⇥</gold> <yellow>{?skip_station}</yellow> <white>站不停车</white> <dark_gray>┃</dark_gray> <gray>前往该站的乘客请换乘后续列车</gray>
    IN_TRIP_4: <gold>⇥</gold> <white>Not stopping at</white> <yellow>{?skip_station_lang2}</yellow> <dark_gray>┃</dark_gray> <gray>Please take a following service</gray>
    SKIP_PASSING_1: <gold>◇━━</gold> <white>列车通过</white> <yellow>{skip_passing}</yellow> <dark_gray>┃</dark_gray> <white>本站不停车</white> <gold>━━◇</gold>
    SKIP_PASSING_2: <gold>◇━━</gold> <white>Passing through</white> <yellow>{skip_passing_lang2}</yellow> <dark_gray>┃</dark_gray> <white>not stopping</white> <gold>━━◇</gold>
    ON_LAYOVER_1: <aqua>◈━━</aqua> <gray>等待新行程</gray> <aqua>━━◈</aqua>
    ON_LAYOVER_2: <aqua>◈━━</aqua> <gray>Preparing for new trip</gray> <aqua>━━◈</aqua>
    ON_LAYOVER_3: <aqua>◈━━</aqua> <white>本列车下一趟</white> <yellow>{?next_trip_departure}</yellow> <white>开往</white> <yellow>{?next_trip_destination}</yellow> <aqua>━━◈</aqua>
    ON_LAYOVER_4: <aqua>◈━━</aqua> <white>Next trip</white> <yellow>{?next_trip_departure}</yellow> <white>to</white> <yellow>{?next_trip_destination_lang2}</yellow> <aqua>━━◈</aqua>
    IDLE_1: <{signal_color_tag}>⬤</{signal_color_tag}> <white>临时停车</white> <dark_gray>━</dark_gray> <gray>等待信号中...</gray>
    IDLE_2: <{signal_color_tag}>⬤</{signal_color_tag}> <white>Holding</white> <dark_gray>━</dark_gray> <gray>Waiting for signal...</gray>
    OUT_OF_SERVICE_1: <{line_color_tag}>█<white> {line}</white> █</{line_color_tag}> <dark_gray>┃</dark_gray> <white>{train_name}</white> <dark_gray>┃</dark_gray> <white>回库</white>
    OUT_OF_SERVICE_2: <{line_color_tag}>█<white> {line_lang2}</white> █</{line_color_tag}> <dark_gray>┃</dark_gray> <white>{train_name}</white> <dark_gray>┃</dark_gray> <white>Not in Service</white>
actionbar:
