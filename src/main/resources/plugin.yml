name: FetaruteTCAddon
version: '0.0.2'
main: org.fetarute.fetaruteTCAddon.FetaruteTCAddon
api-version: '1.20'
authors: [ Acatine ]
website: www.fetarute.org
depend:
  - BKCommonLib
  - Train_Carts
softdepend:
  - TCCoasters
commands:
  fta:
    description: FetaruteTCAddon 主命令
    usage: /fta <info|help|reload|company|operator|line|route|station|depot|graph|occupancy|spawn|speed|eta|train|template|health|pids|drive>
permissions:
  fetarute.admin:
    description: 全局管理员权限
    default: op
    children:
      fetarute.graph: true
      fetarute.graph.build: true
      fetarute.graph.continue: true
      fetarute.graph.status: true
      fetarute.graph.cancel: true
      fetarute.graph.portal: true
      fetarute.sign.stopmark: true
      fetarute.graph.delete: true
      fetarute.graph.info: true
      fetarute.graph.sign: true
      fetarute.graph.query: true
      fetarute.graph.edge: true
      fetarute.speed: true
      fetarute.speed.stick: true
      fetarute.spawn: true
      fetarute.depot.spawn: true
      fetarute.occupancy: true
      fetarute.occupancy.debug: true
      fetarute.health: true
      fetarute.health.check: true
      fetarute.health.heal: true
      fetarute.health.toggle: true
      fetarute.health.clear: true
      fetarute.eta: true
      fetarute.train.config: true
      fetarute.train.debug: true
      fetarute.drive: true
      fetarute.drive.admin: true
      fetarute.drive.driver: true
      fetarute.drive.driver.admin: true
      fetarute.drive.free: true
      fetarute.drive.ato: true
      fetarute.drive.level: true
      fetarute.drive.records: true
      fetarute.drive.top: true
      fetarute.drive.tutorial: true
      fetarute.drive.player: true
      fetarute.template: true
      fetarute.timetable: true
      fetarute.timetable.record: true
      fetarute.timetable.manage: true
      fetarute.pids.manage: true
  fetarute.pids.manage:
    description: 管理全部站台屏（/fta pids；公司成员无此权限也可管理本公司车站的屏幕）
    default: op
  fetarute.trip:
    description: 查看所乘列车的后续站点（/fta trip）
    default: true
  fetarute.announce:
    description: 开启或关闭自己的站台广播（/fta announce）
    default: true
  fetarute.template:
    description: HUD 模板管理（/fta template）
    default: op
  fetarute.timetable:
    description: 查看时刻表与按表运行状态（/fta timetable）
    default: op
  fetarute.timetable.record:
    description: 录制实测运行时分（/fta timetable record）
    default: op
  fetarute.timetable.manage:
    description: 编成、发布与删除时刻表（/fta timetable build|publish|delete）
    default: op
  fetarute.drive.player:
    description: 打包授予全部玩家驾驶功能（基本命令、驾驶非调度列车、驾驶任务、ATO、自选仿真等级、驾驶记录、排行、新手教程）
    default: op
    children:
      fetarute.drive: true
      fetarute.drive.free: true
      fetarute.drive.driver: true
      fetarute.drive.ato: true
      fetarute.drive.level: true
      fetarute.drive.records: true
      fetarute.drive.top: true
      fetarute.drive.tutorial: true
  fetarute.drive:
    description: 手动驾驶的基本命令（/fta drive on|off|status|reverser）；子节点含驾驶非调度列车与新手教程
    default: op
    children:
      fetarute.drive.free: true
      fetarute.drive.tutorial: true
  fetarute.drive.free:
    description: 驾驶非调度列车（自由驾驶）；单独设为 false 时只能驾驶领取了任务的调度列车
    default: op
  fetarute.drive.tutorial:
    description: 新手教程与驾驶情境提示（/fta drive tutorial）
    default: op
  fetarute.drive.admin:
    description: 驾驶管理：查看与强制结束驾驶会话、收回任务、交还调度列车、拥堵熔断、驾驶诊断、查看他人驾驶记录、故障与救援（/fta drive list|stop|revoke|handback|breaker|probe|records <玩家>|fault|rescue）
    default: op
  fetarute.drive.driver:
    description: 领取驾驶任务、驾驶调度列车（/fta drive tasks|task|mode）；子节点含手动驾驶的基本命令、ATO、自选仿真等级、驾驶记录与排行
    default: op
    children:
      fetarute.drive: true
      fetarute.drive.ato: true
      fetarute.drive.level: true
      fetarute.drive.records: true
      fetarute.drive.top: true
  fetarute.drive.ato:
    description: 以 ATO 方式领取与驾驶调度列车（任务板右键、/fta drive mode ato）
    default: op
  fetarute.drive.level:
    description: 在任务板上自选仿真等级（标准或仿真），选择记在玩家数据里；没有时一律用 drive.yml 的 level
    default: op
  fetarute.drive.records:
    description: 查看自己的驾驶记录（/fta drive records）
    default: op
  fetarute.drive.top:
    description: 查看驾驶排行（/fta drive top）
    default: op
  fetarute.drive.driver.admin:
    description: 不领任务直接接管停站中的调度列车
    default: op
  fetarute.graph.portal:
    description: 查看与管理跨世界传送门连接（/fta graph portal）
    default: op
  fetarute.sign.stopmark:
    description: 建停车位置标牌子（stopmark）
    default: op
  fetarute.reload:
    description: 重新加载 FetaruteTCAddon 配置
    default: op
  fetarute.company.create:
    description: 创建公司
    default: true
  fetarute.graph:
    description: 调度图相关命令（/fta graph）
    default: op
  fetarute.graph.build:
    description: 构建并持久化调度图（/fta graph build）
    default: op
  fetarute.graph.continue:
    description: 续跑调度图构建任务（/fta graph continue）
    default: op
  fetarute.graph.status:
    description: 查看调度图构建进度（/fta graph status）
    default: op
  fetarute.graph.cancel:
    description: 取消调度图构建任务（/fta graph cancel）
    default: op
  fetarute.graph.delete:
    description: 删除调度图快照或局部分量（/fta graph delete）
    default: op
  fetarute.graph.info:
    description: 查看调度图摘要与区间距离（/fta graph info）
    default: op
  fetarute.graph.query:
    description: 查询调度图可达性与最短路（/fta graph query/path/component）
    default: op
  fetarute.graph.edge:
    description: 区间运维控制（限速/临时限速/封锁）（/fta graph edge ...）
    default: op
  fetarute.speed:
    description: 业务区间限速控制（/fta speed section ...）
    default: op
  fetarute.speed.stick:
    description: 发放并使用区间限速设置棍（/fta speed stick give ...）
    default: op
  fetarute.spawn:
    description: 发车计划与队列诊断（/fta spawn）
    default: op
  fetarute.graph.sign:
    description: 快速设置节点牌子内容（/fta graph sign ...）
    default: op
  fetarute.depot.spawn:
    description: 手动触发车库生成列车（/fta depot spawn）
    default: op
  fetarute.occupancy:
    description: 调度占用诊断与清理（/fta occupancy）
    default: op
  fetarute.occupancy.debug:
    description: 调度占用调试命令（/fta occupancy debug）
    default: op
  fetarute.health:
    description: 健康监控状态查看（/fta health）
    default: op
  fetarute.health.check:
    description: 手动触发健康检查（/fta health check）
    default: op
  fetarute.health.heal:
    description: 手动修复列车（/fta health heal）
    default: op
  fetarute.health.toggle:
    description: 开关健康监控（/fta health toggle）
    default: op
  fetarute.health.clear:
    description: 清除告警历史（/fta health clear）
    default: op
  fetarute.train.config:
    description: 列车加减速/速度配置（/fta train config）
    default: op
  fetarute.train.debug:
    description: 列车控车诊断与手动调试（/fta train debug）
    default: op
  fetarute.eta:
    description: ETA 诊断命令（/fta eta）
    default: op
