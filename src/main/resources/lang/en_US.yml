      entry-on: "  <gray>•</gray> <white>/fta drive on [cab]</white> <gray>- Start driving from a train seat; with cab, move to the driver's seat first</gray>"
      entry-off: "  <gray>•</gray> <white>/fta drive off</white> <gray>- Stop driving</gray>"
      entry-status: "  <gray>•</gray> <white>/fta drive status</white> <gray>- Show the current driving state</gray>"
      entry-reverser: "  <gray>•</gray> <white>/fta drive reverser <forward|neutral|reverse></white> <gray>- Set the reverser while stopped</gray>"
      entry-split: "  <gray>•</gray> <white>/fta drive split <keep|switch|end></white> <gray>- After the train divides: keep driving the part that stays, switch to the detached part, or end driving</gray>"
      entry-call: "  <gray>•</gray> <white>/fta drive call [signal|doors|obstruction]</white> <gray>- Call the signaller while driving a dispatched train, optionally with a reason (waiting at the signal, door fault, something on the line); with no guard on board, two short rings do the same</gray>"
      entry-list: "  <gray>•</gray> <white>/fta drive list</white> <gray>- List all driving sessions</gray>"
      entry-stop: "  <gray>•</gray> <white>/fta drive stop [player]</white> <gray>- Force a player to stop driving</gray>"
      entry-probe: "  <gray>•</gray> <white>/fta drive probe [on|off]</white> <gray>- Toggle driving input diagnostics</gray>"
      entry-handback: "  <gray>•</gray> <white>/fta drive handback <player|all></white> <gray>- Hand driver-controlled dispatched trains back to automatic operation</gray>"
      entry-rescue: "  <gray>•</gray> <white>/fta drive rescue <train> [destroy]</white> <gray>- End driving on a train and move everyone aboard to a platform, optionally destroying the train</gray>"
      entry-tasks: "  <gray>•</gray> <white>/fta drive tasks [station code]</white> <gray>- Open the task board of the nearest (or given) station</gray>"
      entry-tutorial: "  <gray>•</gray> <white>/fta drive tutorial [start|restart|stop|reset|skip]</white> <gray>- Start, start over, quit or reset the tutorial, or skip the current step</gray>"
      entry-task: "  <gray>•</gray> <white>/fta drive task [status|abandon|goto|pickup]</white> <gray>- Show or abandon your task, go to the train to pick up, or pick it up at the depot</gray>"
      entry-mode: "  <gray>•</gray> <white>/fta drive mode <manual|ato></white> <gray>- Switch between manual and ATO while stopped</gray>"
      entry-congestion: "  <gray>•</gray> <white>/fta drive congestion [status|reset]</white> <gray>- Show or lift congestion protection</gray>"
      entry-records: "  <gray>•</gray> <white>/fta drive records [player]</white> <gray>- Show driving records</gray>"
      entry-top: "  <gray>•</gray> <white>/fta drive top [week|all]</white> <gray>- Driving leaderboard</gray>"
      entry-revoke: "  <gray>•</gray> <white>/fta drive revoke <player></white> <gray>- Revoke a player's driving task</gray>"
      entry-fault: "  <gray>•</gray> <white>/fta drive fault <player> <type|clear></white> <gray>- Inject or clear train faults on a simulation-level driving session</gray>"
      entry-cab: "  <gray>•</gray> <white>/fta drive cab</white> <gray>- Go straight to the departure-end cab: when changing ends, or to start driving</gray>"
