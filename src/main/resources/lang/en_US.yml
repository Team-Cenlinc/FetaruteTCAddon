# Station signaller: console (PIDS screen with a signalbox layout), duty, calls and replies
signaller:
  mode:
    manual: "Manual"
    auto: "Auto"
  command:
    player-only: "<prefix> <red>Only players can run this command</red>"
    unavailable: "<prefix> <red>The signaller feature is not ready</red>"
    not-on-duty: "<prefix> <gray>You are not on duty at a signal box</gray>"
    status:
      header: "<prefix> <dark_aqua>Signal boxes</dark_aqua>"
      line: "<gray>-</gray> <white><name></white> <gray>(<operator>:<zone>)</gray> <aqua><mode></aqua> <gray>Signaller:</gray> <white><signaller></white> <gray>waiting <white><waiting></white> · permits <white><permits></white> · held <white><holds></white></gray>"
      empty: "<prefix> <gray>No signal box is in use</gray>"
      transient: " (temporary)"
      nobody: "nobody"
  duty:
    prompt: "<prefix> <white>Control zone <aqua><zone></aqua> is unstaffed.</white> <click:run_command:'/fta signal on'><hover:show_text:'<gray>Click to run:</gray> <white>/fta signal on</white>'><green>[Go on duty]</green></hover></click>"
    occupied: "<prefix> <yellow>Control zone <white><zone></white> is staffed by <white><signaller></white></yellow>"
    started: "<prefix> <green>On duty at <aqua><zone></aqua>; the zone is now manual.</green> <gray>Trains entering the zone need a route set by the signaller. Staying more than <white><range></white> blocks from the console for over <white><grace></white> seconds ends the duty and returns the zone to auto. /fta signal off to go off duty</gray>"
    started-auto: "<prefix> <yellow>On duty at <aqua><zone></aqua>; the dispatch graph is not ready, so the zone stays in auto for now. Switch to manual on the console once it is ready</yellow>"
    start:
      disabled: "<prefix> <red>The signaller feature is disabled</red>"
      no-permission: "<prefix> <red>You do not have the signaller permission</red>"
      no-request: "<prefix> <red>Right-click a signal box console first, then confirm</red>"
      zone-not-found: "<prefix> <red>The console's control zone no longer exists</red>"
      already-on-duty: "<prefix> <yellow>Already on duty at <white><zone></white></yellow>"
      zone-taken: "<prefix> <red>Control zone <white><zone></white> is already staffed by <white><signaller></white></red>"
      busy-driver: "<prefix> <red>You are driving or hold a driving task, so you cannot staff a signal box at the same time</red>"
      busy-guard: "<prefix> <red>You are working as a guard or hold a guard task, so you cannot staff a signal box at the same time</red>"
      no-split: "<prefix> <red>No stations of <white><zone></white> are left to split off</red>"
    away: "<prefix> <yellow>You left the <white><zone></white> console; return within <white><grace></white> seconds or the duty ends</yellow>"
    away-bar: "<yellow>Away from the console; duty ends in <white><grace></white> s</yellow>"
    back: "<prefix> <green>Back at the <white><zone></white> console</green>"
