    tip: "<prefix> <aqua>Guard tip</aqua> <text>"
    tips:
      on-duty:
        chat: "<white>On duty:</white> <gray>each step is shown in the sidebar's Task row (which slot to right-click and the seconds left); button results show in the Notice row at the top. Select a hotbar slot and right-click to use it; F opens the guard panel. To leave midway, click End duty twice in the F panel or run /fta guard off: stops done so far are scored and a claimed duty counts as abandoned; walking away without ending counts as left behind.</gray> <click:run_command:'/fta handbook guard'><hover:show_text:'<gray>Get the FTCA Guard Handbook</gray>'><aqua>[Guard Handbook]</aqua></hover></click>"
        subtitle: "<aqua>Each step is shown in the sidebar</aqua>"
      open-doors:
        chat: "<white>Open the doors:</white> <gray>the train has stopped. The sidebar's Station row says which side to open, in the direction of travel (sitting at the rear facing back, that is the opposite of your own left and right): right-click slot 1 for the left doors, slot 2 for the right. Once open you may press Shift to step onto the platform; the sidebar's Task row counts down the dwell; close the doors when it reaches zero.</gray>"
        subtitle: "<yellow>Check the side in the sidebar; right-click slot 1 or 2</yellow>"
      close-doors:
        chat: "<white>Closing and watching:</white> <gray>the dwell is over. Stand on the platform near your car (or the car you were moved to if yours stays shut), right-click slot 3 to close, and watch the doors until they are shut; the closing watch counts towards your score.</gray>"
        subtitle: "<yellow>Watch the doors from the platform; right-click slot 3</yellow>"
      return-seat:
        chat: "<white>Back to your seat:</white> <gray>the doors are shut. Return to the guard's seat: sit back in your cab, right-click your train from the platform, or use Back to seat in the F panel.</gray>"
        subtitle: "<yellow>Return to the guard's seat</yellow>"
      wait-exit:
        chat: "<white>Starting signal:</white> <gray>the starting signal is not clear yet, so this step is not timed; confirm once the sidebar's Starter row shows clear.</gray>"
        subtitle: "<gray>Not timed until the starting signal clears</gray>"
      confirm:
        chat: "<white>Signal check:</white> <gray>the starting signal is clear; right-click slot 6 to confirm it.</gray>"
        subtitle: "<yellow>Right-click slot 6 to confirm</yellow>"
      buzzer:
        chat: "<white>Buzzer:</white> <gray>hold right-click on slot 7 for about a second to sound one long, the ready-to-start signal; the driver (or ATO) then starts. Right-click twice within a second to call the driver.</gray>"
        subtitle: "<yellow>Hold right-click on slot 7 for about a second</yellow>"
      departure-watch:
        chat: "<white>Departure watch:</white> <gray>the signal is given. As the train starts, look at the platform or behind until the rear has left the platform; the departure watch counts towards your score. In danger, right-click slot 9 for an emergency stop.</gray>"
        subtitle: "<yellow>Watch the platform until the rear has left</yellow>"
      cab-change:
        chat: "<white>Changing ends:</white> <gray>the next trip leaves from the other end; move to the guard's seat in the car shown in the sidebar's Change ends row. If time is short you are moved there, and when the driver changes ends you both swap together.</gray>"
        subtitle: "<yellow>Move to the guard's seat at the other end</yellow>"
