          handbook: "<prefix> <white>Study:</white><gray> the FTCA Guard Handbook is in your inventory; read it before you start.</gray> <click:run_command:'/fta handbook guard'><hover:show_text:'<gray>Get another copy</gray>'><aqua>[Guard Handbook]</aqua></hover></click>"
        tutorial:
          header: "<prefix> <gold><bold>Level <level> · <name> exam</bold></gold>"
