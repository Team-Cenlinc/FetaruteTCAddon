    help:
      header: "<prefix> <dark_aqua>Manual driving commands</dark_aqua>"
      entry-on: "  <gray>•</gray> <white>/fta drive on [cab]</white> <gray>- Start driving from a train seat; with cab, move to the driver's seat first</gray>"
