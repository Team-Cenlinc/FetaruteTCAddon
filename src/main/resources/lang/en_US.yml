      walk: "<prefix> <white>Leaving the seat does not end the drive: the next trip departs from the cab in car <yellow><car></yellow>; take a seat there before departure</white> <click:run_command:'/fta drive off'><hover:show_text:'<gray>Click to run:</gray> <white>/fta drive off</white>'><red>[End driving]</red></hover></click>"
      walk-either: "<prefix> <white>Leaving the seat does not end the drive: the departure direction is not set yet, so you may wait in the cab at either end; once dispatched you must drive from the leading end, and if seated at the other end, change ends within the time limit</white> <click:run_command:'/fta drive off'><hover:show_text:'<gray>Click to run:</gray> <white>/fta drive off</white>'><red>[End driving]</red></hover></click>"
      switch-offer: "<prefix> <click:run_command:'/fta drive cab'><hover:show_text:'<gray>Click to run:</gray> <white>/fta drive cab</white>'><aqua>[Move to the cab in car <car>]</aqua></hover></click>"
