      level-open-tutorial: "  <aqua>○</aqua> <white>Level <level> · <hover:show_text:'<gray><description></gray>'><name></hover></white> <gray>exam: complete the tutorial</gray> <click:run_command:'/fta license exam <class>'><hover:show_text:'<gray>Click to sign up</gray>'><green>[Take the exam]</green></hover></click>"
