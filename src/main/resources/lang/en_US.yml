    card:
      title: "FTCA Driving Licence"
      author: "Fetarute"
      heading: "<dark_blue><bold>FTCA Driving Licence</bold></dark_blue>"
      holder: "<dark_gray>Holder</dark_gray> <black><player></black>"
      serial: "<dark_gray>No.</dark_gray> <black><serial></black>"
      classes: "<dark_gray>Levels</dark_gray>"
      class: "<black>· <name></black>\n  <dark_gray><date></dark_gray>"
      notice: "<black>Valid across the server for every FTCA train.</black>\n\n<dark_gray>Driving permission follows the system record; this book is only a certificate. Lost it? Run /fta license reissue.\n\nLevels and exams: /fta license</dark_gray>"
  handbook:
    driver:
      title: "FTCA Driver Handbook"
      author: "Fetarute"
      given: "<prefix> <green>The FTCA driver handbook is in your inventory</green>"
      page-1: "<dark_blue><bold>FTCA Driver Handbook</bold></dark_blue>\n\n<black>1. What FTCA does\n2. Licences\n3. Tasks and taking over\n4. The cab\n5. Signals and speed\n6. Stopping and doors\n7. Departing on time\n8. Termini and changing ends\n9. When things go wrong</black>"
      page-2: "<dark_blue><bold>1. What FTCA does</bold></dark_blue>\n<black>FTCA dispatches trains to the timetable, sets routes and controls signals. Players can take over these trains: dispatch gives movement authority and stops; the driver drives smoothly, stops accurately, works the doors and keeps time.</black>"
      page-3: "<dark_blue><bold>2. Licences</bold></dark_blue>\n<black>Level 1 learner licence: complete the tutorial; drive non-dispatched trains.\nLevel 2 driver licence: practise, then pass a road test; take tasks on dispatched trains.\nLicences are valid everywhere.</black>\n<dark_gray>See and sign up: /fta license</dark_gray>"
      page-4: "<dark_blue><bold>3. Tasks and taking over</bold></dark_blue>\n<black>At a station run /fta drive tasks: left-click for manual, right-click for ATO. When the train arrives, sit in the leading cab, confirm your seat and run /fta drive on. If you are not in the driver's seat, a chat button can move you there.</black>"
      page-5: "<dark_blue><bold>4. The cab</bold></dark_blue>\n<black>Hotbar 1–3 power P3–P1, 4 coast N, 5–8 brake B1–B4, 9 emergency EB.\nOnce stopped, F opens the cab panel (doors, end driving).\nAction bar: speed and limit.\nSidebar: signal, stop, times, doors.</black>"
      page-6: "<dark_blue><bold>5. Signals and speed</bold></dark_blue>\n<black>The sidebar signal is your authority: proceed at the limit; caution/slow means reduce speed; stop means stop ahead. Right-click to acknowledge a restrictive signal.\nThe advised speed in the boss bar follows the timetable curve; follow it to keep time.</black>"
      page-7: "<dark_blue><bold>6. Stopping and doors</bold></dark_blue>\n<black>The sidebar shows metres to the stop mark. Brake early; stopping within the door range passes, an accurate stop is better; move up if short, you cannot reverse after overrunning. At termini you may overrun the stop mark by 3 m at most, or the train is forcibly stopped.\nOnce stopped press F, open the platform side, close when the dwell ends.</black>"
      page-8: "<dark_blue><bold>7. Departing on time</bold></dark_blue>\n<black>Depart once the doors are closed and the signal allows; early starts are blocked.\nThe sidebar shows scheduled times and the delay; recover lateness within the limit.\nStop and trip scores are shown at the end.</black>"
      page-9: "<dark_blue><bold>8. Termini and changing ends</bold></dark_blue>\n<black>At the terminus the trip is scored once the doors open; you may end driving or carry on with this train's next trip.\nTo change ends, leave the doors open and walk to the other cab; unmarked cab seats must be confirmed. Under ATO you change ends too; the train departs once you are seated.</black>"
      page-10: "<dark_blue><bold>9. When things go wrong</bold></dark_blue>\n<black>If dispatch holds you, wait for the signal. Use the emergency brake only when you must stop at once. Don't leave the seat while moving; at a terminus you may walk to the departure-end cab, elsewhere leaving ends driving. Hand back to automatic operation if stuck.</black>\n<dark_gray>Full handbook: Fetarute Wiki.</dark_gray>"
