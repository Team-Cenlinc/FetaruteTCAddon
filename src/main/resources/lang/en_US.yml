          route: "<prefix> <white>Exam train: <line> to <yellow><destination></yellow>, leaving <yellow><takeover></yellow><platform> at <yellow><time></yellow>; work <stops> stops and hand over at <yellow><handover></yellow>.</white> <gray>Trip <trip></gray>"
          duties: "<prefix> <white>What you do:</white><gray> work <stops> stops as guard on a dispatched train: open the platform-side doors, close them when the dwell ends, watch them close, return to your seat, confirm the starting signal and give the ready-to-start signal (hold right-click on slot 7 for about a second), then watch the platform on departure.</gray>"
          watch: "<prefix> <white>Review:</white><gray> each stop is reviewed item by item: opening, closing, closing watch, starting signal, departure watch.</gray>"
          pass: "<prefix> <white>To pass:</white><gray> work <stops> stops and score at least <min>; any timeout (doors opened or closed by the station, or the signal given for you) fails the exam.</gray>"
