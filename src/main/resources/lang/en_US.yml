        short: "<prefix> <yellow>Train <white><train></white> has only <white><left></white> stops left on this trip after here: guard practice works <white><stops></white> stops and hands over at the next one (<white><need></white> in all); pick another train.</yellow>"
        in-progress: "<prefix> <yellow>You are on a <white><name></white> practice run; finish it first</yellow> <click:run_command:'/fta guard task abandon'><hover:show_text:'<gray>Abandon this practice run (it does not count)</gray>'><gray>[Abandon practice]</gray></hover></click>"
        not-started: "<prefix> <yellow>You did not go on duty; this <white><name></white> practice run was cancelled and does not count</yellow>"
        stop: "<prefix> <gray>Guard practice <done>/<total></gray> <white><station></white> <gray>open</gray> <open> <gray>close</gray> <close> <gray>closing watch</gray> <closing> <gray>signal</gray> <signal> <gray>departure watch</gray> <departure>"
        drill-ok: "<prefix> <gray>Guard practice</gray> <white><station></white> <gray>caught-in-door drill</gray> ✔ <gray>handled in <seconds> s</gray>"
        drill-missed: "<prefix> <red>Guard practice: the caught-in-door report at <station> was not handled in time; in the exam this fails</red>"
        brief:
          header: "<prefix> <gold><bold><name> practice</bold></gold>"
          route: "<prefix> <white>Practice train <aqua><train></aqua>: <line> to <yellow><destination></yellow>; from <yellow><takeover></yellow> work <stops> stops and hand over at <yellow><handover></yellow>.</white> <gray>Trip <trip></gray>"
          what: "<prefix> <white>How it works:</white><gray> the same as the exam, with each stop reviewed item by item; after <stops> stops you get a review by exam standards and the run counts. No licence, no reward, nothing recorded.</gray>"
          how: "<prefix> <white>How to start:</white><gray> while the train is stopped, sit in the rear cab and you are on duty (you will be told which car); on a train laying over at a terminal, just be seated before it leaves.</gray>"
          handbook: "<prefix> <white>Study:</white><gray> the FTCA Guard Handbook is in your inventory; use it as you practise.</gray>"
        review:
          header: "<prefix> <gold><bold><name> practice review</bold></gold>"
          passed: "<prefix> <green>By exam standards: pass</green> <white>(<reason>)</white>"
          failed: "<prefix> <red>By exam standards: fail</red> <white>(<reason>)</white>"
          void: "<prefix> <yellow>This practice run cannot be judged: <reason></yellow>"
          not-counted: "<prefix> <yellow>You did not work all the stops; this run does not count.</yellow>"
          ready: "<prefix> <green>Guard practice done <done>/<required>; once you hand over at the next stop you can take the exam</green> <click:run_command:'/fta license exam <class>'><hover:show_text:'<gray>After handing over, click near a station to sign up</gray>'><green>[Take the exam]</green></hover></click>"
          more: "<prefix> <yellow>Guard practice done <done>/<required>; keep practising: board the dispatched train you want and run <white>/fta license practice <class></white></yellow>"
      signaller:
        in-progress: "<prefix> <yellow>You are doing the <white><name></white> practice</yellow> <click:run_command:'/fta license abandon'><hover:show_text:'<gray>Abandon this practice (does not count)</gray>'><gray>[Abandon the practice]</gray></hover></click>"
        expired: "<prefix> <yellow>You did not go on duty in time; the <white><name></white> practice was cancelled, sign up again</yellow>"
        brief:
          header: "<prefix> <gold><bold><name> practice</bold></gold> <gray>go on duty at any signal box console within <white><window></white> min; you will be guided step by step</gray>"
          how: "<prefix> <white>Going on duty:</white><gray> right-click the console screen, then confirm with <white>/fta signal on</white>. You hold signaller permission during practice.</gray>"
          pass: "<prefix> <white>Counting:</white><gray> finish every step, then go off duty with /fta signal off to count one practice run. Practice writes no record and pays no reward; unattended trains are still routed by the system, so nothing gets stuck.</gray>"
          handbook: "<prefix> <gray>The FTCA Signaller Handbook is in your inventory; run /fta handbook signaller for another copy.</gray>"
        step: "<prefix> <gold>Signaller practice</gold> <gray>(<index>/<total>)</gray> <text>"
        step-first: "<prefix> <gold>Signaller practice</gold> <text>"
        skipped: "<prefix> <gray>This zone has no stations; skipping \"<step>\"</gray>"
        all-done: "<prefix> <green>All practice steps done</green>"
        steps:
          on-duty:
            name: "Go on duty"
            chat: "<white>Go on duty:</white><gray> walk up to a signal box console, right-click the screen, then confirm with <white>/fta signal on</white>. You hold signaller permission during practice.</gray>"
            subtitle: "<yellow>Right-click the console, then /fta signal on</yellow>"
          screen:
            name: "The console"
            chat: "<white>The console:</white><gray> the title bar shows the zone, the mode badge (manual/auto), the signaller and short notices; the yard diagram shows tracks, platforms, entry signals and trains, with occupied track in red; the train list shows approaching, waiting, in-zone and dwelling trains; the button area has six buttons. Continues shortly.</gray>"
            subtitle: "<yellow>Look around: title bar, yard, train list, buttons</yellow>"
          manual:
            name: "Manual mode"
            chat: "<white>Manual mode:</white><gray> going on duty switched the zone to manual and the badge reads \"manual\": trains need a route from you to enter. If it reads \"auto\", press \"Switch to manual\".</gray>"
            subtitle: "<yellow>Check the badge reads \"manual\"</yellow>"
          select:
            name: "Select a train"
            chat: "<white>Select a train:</white><gray> click a train in the train list; its route is previewed in light blue on the yard. When it can be moved to another platform, the platform numbers appear under the buttons.</gray>"
            subtitle: "<yellow>Click a train in the train list</yellow>"
          set-route:
            name: "Set a route"
            chat: "<white>Set a route:</white><gray> wait for a train at the zone entry (the list says \"waiting at entry\", the entry signal is red), select it and press \"Set route\"; approaching trains can be routed in advance. Trains left waiting too long are routed by the system (costs points in the exam).</gray>"
            subtitle: "<yellow>Select a waiting train, press \"Set route\"</yellow>"
          hold:
            name: "Hold a train"
            chat: "<white>Hold a train:</white><gray> select a train dwelling in the zone (the list says \"dwelling\") and press \"Hold\": it will not depart when its dwell ends.</gray>"
            subtitle: "<yellow>Select a dwelling train, press \"Hold\"</yellow>"
          release:
            name: "Release"
            chat: "<white>Release:</white><gray> select the held train and press \"Release\". Holds have a limit and release on their own.</gray>"
            subtitle: "<yellow>Select the held train, press \"Release\"</yellow>"
          auto-pass:
            name: "Auto pass"
            chat: "<white>Auto pass:</white><gray> select a train and press \"Auto pass\": later trains from the same entry to the same track are let through, and the entry signal shows \"A\". Good for routes you do not need to watch.</gray>"
            subtitle: "<yellow>Select a train, press \"Auto pass\"</yellow>"
          auto-pass-off:
            name: "Cancel auto pass"
            chat: "<white>Cancel auto pass:</white><gray> select a train on that route and press \"Cancel auto pass\", or click the entry signal marked \"A\".</gray>"
            subtitle: "<yellow>Press \"Cancel auto pass\" or click the A signal</yellow>"
          answer-call:
            name: "Answer a call"
            chat: "<white>Answer a call:</white><gray> a train will make a simulated call shortly: the call badge lights up in the title bar with the train and the reason. Click it; the buttons turn into four replies. Pick by reason: waiting at the signal - \"Route is being set\" or \"Train ahead, please wait\"; door fault - \"Acknowledged\"; something on the line - \"Proceed at caution speed\". A wrong or missed reply brings another call.</gray>"
            subtitle: "<yellow>Click the call badge and reply by reason</yellow>"
          off-duty:
            name: "Go off duty"
            chat: "<white>Go off duty:</white><gray> all steps done. Run <white>/fta signal off</white>; the zone goes back to auto and the practice counts.</gray>"
            subtitle: "<yellow>Run /fta signal off</yellow>"
        tips:
          call: "<prefix> <aqua>Signaller tip</aqua> <gray>A driver or guard is calling: click the call badge in the title bar and pick a reply. An unanswered call counts as missed (costs points in the exam).</gray>"
          auto-routed: "<prefix> <aqua>Signaller tip</aqua> <gray>A train waited too long and the system routed it (costs points in the exam). Watch for \"waiting at entry\" in the train list.</gray>"
          call-missed: "<prefix> <aqua>Signaller tip</aqua> <gray>A call went unanswered and counts as missed (costs points in the exam).</gray>"
          to-auto: "<prefix> <aqua>Signaller tip</aqua> <gray>The zone is on auto: the system lets trains through. Switching to auto fails the exam; press \"Switch to manual\" to carry on practising.</gray>"
          idle-auto: "<prefix> <aqua>Signaller tip</aqua> <gray>Several trains went unattended, so the system switched the zone to auto (an instant fail in the exam). Press \"Switch to manual\" to carry on.</gray>"
        review:
          header: "<prefix> <gold><bold><name> practice review</bold></gold> <gray>zone <white><zone></white></gray>"
          counts: "<prefix> <gray><white><manual></white> routed by hand · <white><auto></white> auto-routed · <white><missed></white> calls missed · <white><wrong></white> wrong replies · <white><points></white> points by exam standards (pass mark <min>)</gray>"
          not-counted: "<prefix> <yellow>Practice not finished; this run does not count. Still to do: <white><steps></white></yellow>"
          separator: ", "
          ready: "<prefix> <green>Signaller practice done <done>/<required>; you can sign up for the exam</green> <click:run_command:'/fta license exam <class>'><hover:show_text:'<gray>After signing up, go on duty at a console in time</gray>'><green>[Take the exam]</green></hover></click>"
          more: "<prefix> <yellow>Signaller practice done <done>/<required>; keep practising</yellow> <click:run_command:'/fta license practice <class>'><hover:show_text:'<gray>Click to sign up for practice</gray>'><aqua>[Practise again]</aqua></hover></click>"
    guard:
      late: "<prefix> <yellow>This trip is <white><delay></white> s late. Drive smoothly within the limit and recover time; if the delay keeps growing, the train will be handed back to automatic operation.</yellow>"
      drill-cancelled: "<prefix> <gray>The incident drill was cancelled and the fault cleared.</gray>"
      handback: "<prefix> <red>This trip is <white><delay></white> s late. To keep the service running, the train will be handed back to automatic operation once stopped; this run ends.</red>"
    coach:
      signal: "<prefix> <aqua>Coach:</aqua> <gray>Restrictive signal: right-click to acknowledge and slow down for it.</gray>"
      overspeed: "<prefix> <aqua>Coach:</aqua> <gray>You are over the <white><limit></white> km/h limit; brake with B1–B4.</gray>"
      approach: "<prefix> <aqua>Coach:</aqua> <gray>Approaching <white><station></white>. Watch the stop-mark distance in the sidebar, brake early and ease off as you get close.</gray>"
      open-doors: "<prefix> <aqua>Coach:</aqua> <gray>Stopped. Press F for the cab panel and open the <white><side></white> doors.</gray>"
      no-doors: "<prefix> <aqua>Coach:</aqua> <gray>Stopped. No doors to open here; wait for the dwell to finish.</gray>"
      dwell: "<prefix> <aqua>Coach:</aqua> <gray>Dwelling; watch the countdown in the sidebar.</gray>"
      close-doors: "<prefix> <aqua>Coach:</aqua> <gray>Dwell over; press F and close the doors.</gray>"
      wait-departure: "<prefix> <aqua>Coach:</aqua> <gray>Doors closed; wait for the departure signal to clear.</gray>"
      guard-doors: "<prefix> <aqua>Coach:</aqua> <gray>Stopped. This train has a guard, who works the doors; you do not. Wait for the guard to close up and give the ready-to-start signal.</gray>"
      guard-signal: "<prefix> <aqua>Coach:</aqua> <gray>Doors closed. Wait for the guard's ready-to-start signal (one long) once the starting signal clears; start when the action bar shows the departure signal.</gray>"
      depart: "<prefix> <aqua>Coach:</aqua> <gray>Clear to depart. Start smoothly in P1, then follow the advised speed in the boss bar.</gray>"
      side:
        left: "left"
        right: "right"
        both: "left and right"
        platform: "platform-side"
    drill:
      announce: "<prefix> <gold><bold>Incident drill</bold></gold> <gray>The following incident is simulated; follow the prompts.</gray>"
      start:
        line-loss: "<prefix> <red>Line voltage lost: traction is unavailable.</red> <gray>Return to N or brake, do not keep notching up; power returns in about <seconds> s.</gray>"
        door: "<prefix> <red>Door fault: the door-closed loop is open and traction is blocked.</red> <gray>Make sure every door is closed, then press F and switch on the door bypass.</gray>"
        emergency: "<prefix> <red><bold>Obstacle ahead!</bold></red> <gray>Go to EB (hotbar 9) immediately and stop before continuing.</gray>"
        breaker-trip: "<prefix> <red>Main breaker tripped: traction and electric braking lost.</red> <gray>Return to N, press F, open the main breaker and then close it; resume once it has closed.</gray>"
      done:
        line-loss: "<prefix> <green>Line voltage restored; you may notch up again.</green> <gray>Reaction time <seconds> s.</gray>"
        door: "<prefix> <green>Door bypass on, traction restored; you may depart.</green> <gray>Handled in <seconds> s.</gray>"
        emergency: "<prefix> <green>The train has stopped.</green> <gray>Reaction time <seconds> s. Move off once the way is clear and the signal allows.</gray>"
        breaker-trip: "<prefix> <green>Main breaker reset, traction restored.</green> <gray>Handled in <seconds> s.</gray>"
      bypass-off: "<prefix> <gray>The door fault is cleared. At the next stop, press F and switch the door bypass off.</gray>"
      timeout: "<prefix> <yellow>The <white><name></white> drill was not handled in time and has been withdrawn.</yellow>"
      review:
        good: "<prefix> <green>Incident drill (<name>): handled well in <seconds> s.</green>"
        slow: "<prefix> <yellow>Incident drill (<name>): handled, but took <seconds> s.</yellow>"
        missed: "<prefix> <red>Incident drill (<name>): not handled.</red>"
      tip:
        line-loss: "<prefix> <gray>Tip: on line voltage loss, return to N or brake at once instead of holding traction; move off again once power returns.</gray>"
        door: "<prefix> <gray>Tip: when traction is blocked and the sidebar shows a door fault, confirm the doors are closed, then use the door bypass; switch it off at the next stop.</gray>"
        emergency: "<prefix> <gray>Tip: go to EB the moment you see an obstacle; the faster you react, the shorter the stopping distance.</gray>"
        breaker-trip: "<prefix> <gray>Tip: on a breaker trip, return to N, then open and close the main breaker in the cab panel; notch up only once it has closed.</gray>"
      name:
        line-loss: "line voltage loss"
        door: "door fault"
        emergency: "emergency stop"
        breaker-trip: "main breaker trip"
