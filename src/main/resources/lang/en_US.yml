  handbook:
    guard:
      title: "FTCA Guard Handbook"
      author: "Fetarute"
      given: "<prefix> <green>The FTCA Guard Handbook is in your inventory</green>"
      page-1: "<dark_blue><bold>FTCA Guard Handbook</bold></dark_blue>\n\n<black>1. Going on duty\n2. Station work\n3. Closing and watching\n4. Buzzer and emergency stop\n5. Terminals and scores\n6. Practice and exam</black>"
      page-2: "<dark_blue><bold>1. Going on duty</bold></dark_blue>\n<black>Sit in the rear cab of a dispatched train and run /fta guard on, or take a duty with /fta guard tasks and sit in the rear cab when it arrives. Your seat is reserved. Hotbar: select, right-click. F: menu. /fta guard off ends duty.</black>"
      page-3: "<dark_blue><bold>2. Station work</bold></dark_blue>\n<black>Once stopped, right-click 1 (left) or 2 (right, by direction of travel) for the platform-side doors and step out. When the sidebar dwell count ends, right-click 3 to close. Opening has 30 s, closing 15 s; on timeout the station does it. Right-click 4 to report: 30 s more.</black>"
      page-4: "<dark_blue><bold>3. Closing and watching</bold></dark_blue>\n<black>While the doors close, stand on the platform by your car (or the one you were moved to) and watch along the train until shut. Then return to your seat. After departure look at the platform or behind until the rear has left. Both watches count.</black>"
      page-5: "<dark_blue><bold>4. Buzzer and emergency</bold></dark_blue>\n<black>Seated, right-click 6 once the starting signal clears, then hold right-click on 7 for a second (one long). One short: received; two clicks: call the driver (no driver: the signaller). Right-click 9: emergency stop; one long releases it.</black>"
      page-6: "<dark_blue><bold>5. Terminals and scores</bold></dark_blue>\n<black>At a terminal move to the cab at the other end; you and the driver swap together, and are moved for you when time is short. Timeouts and wrong doors cost 5 points, early closing and missed watches 2; incident reports cost nothing.</black>"
      page-7: "<dark_blue><bold>6. Practice and exam</bold></dark_blue>\n<black>Practice: board a dispatched train and run /fta license practice guard.\nExam: sign up at a station with /fta license exam guard; a trip is assigned. A timeout or wrong door fails.</black>"
    signaller:
      title: "FTCA Signaller Handbook"
      author: "Fetarute"
      given: "<prefix> <green>The FTCA Signaller Handbook is in your inventory</green>"
      page-1: "<dark_blue><bold>FTCA Signaller Handbook</bold></dark_blue>\n\n<black>1. Zones and duty\n2. The console\n3. Setting routes\n4. Holds and platforms\n5. Auto pass and modes\n6. Calls\n7. Scores and rewards\n8. Practice and exam</black>"
      page-2: "<dark_blue><bold>1. Zones and duty</bold></dark_blue>\n<black>A signaller runs a control zone: trains need a route from you to enter it. Right-click a signal box console and run /fta signal on to go on duty; the zone switches to manual. /fta signal off ends the duty and the zone goes back to auto. Leaving the console too far for too long ends it too.</black>"
      page-3: "<dark_blue><bold>2. The console</bold></dark_blue>\n<black>Title bar: zone, mode badge, signaller and notices. Yard: tracks, platforms, entry signals and trains; red is occupied, light blue the selected train's route, dashed white a route set but not yet locked. A manned station zone nested inside yours is framed in dashed amber and run by its own signaller.</black>"
      page-4: "<dark_blue><bold>3. Setting routes</bold></dark_blue>\n<black>A train stops at the entry and waits: the list says \"waiting at entry\" and the entry signal is red. Select it and press \"Set route\"; if another train is in the way, the route stays pending. Approaching trains can be routed in advance. Cancelling a route with a train on approach time-locks the entry for a while. Unattended trains are routed by the system after a while.</black>"
      page-5: "<dark_blue><bold>4. Holds and platforms</bold></dark_blue>\n<black>Select a train dwelling in the zone and press \"Hold\": it will not depart when its dwell ends; \"Release\" lets it go, and holds release on their own at the limit. When the selected train can use another platform, the numbers appear under the buttons; click one to switch. Once the route locks it cannot change.</black>"
      page-6: "<dark_blue><bold>5. Auto pass and modes</bold></dark_blue>\n<black>Select a train and press \"Auto pass\": later trains from the same entry to the same track go through on their own, shown by an A at the entry signal; \"Cancel auto pass\" or clicking the A signal undoes it. \"Switch to auto\" hands the whole zone back to the system; several unattended trains in a row do the same.</black>"
      page-7: "<dark_blue><bold>6. Calls</bold></dark_blue>\n<black>When a driver or guard calls, the call badge shows who is calling and why; click it and reply to fit:\nwaiting at the signal - \"Route is being set\" or \"Train ahead, please wait\";\ndoor fault - \"Acknowledged\";\nsomething on the line - \"Proceed at caution speed\".\nNo reply in time counts as missed; an unfitting one as wrong.</black>"
      page-8: "<dark_blue><bold>7. Scores and rewards</bold></dark_blue>\n<black>Each shift starts at 100: auto-routing, missed calls and wrong replies cost 5 each, a train losing time in the zone 2, and two trains from different entries losing too much time together at a junction 3. Rewards count trains routed by hand; pre-routing and keeping time add half a train each, a good junction order a whole one.</black>"
      page-9: "<dark_blue><bold>8. Practice and exam</bold></dark_blue>\n<black>Practice: run /fta license practice signaller, go on duty at a console, follow the steps, then go off duty with /fta signal off to count it.\nExam: run /fta license exam signaller, go on duty in time and route the required number of trains by hand; one simulated call comes in. Auto-routing, missed calls and wrong replies cost points; falling below the pass mark or switching to auto fails.</black>\n<dark_gray>See /fta license for the train count, pass mark and time limit.</dark_gray>"
    driver:
      title: "FTCA Driver Handbook"
      author: "Fetarute"
      given: "<prefix> <green>The FTCA driver handbook is in your inventory</green>"
      page-1: "<dark_blue><bold>FTCA Driver Handbook</bold></dark_blue>\n\n<black>1. What FTCA does\n2. Operating licence\n3. Tasks and taking over\n4. The cab\n5. Signals and speed\n6. Stopping and doors\n7. Departing on time\n8. Termini and changing ends\n9. When things go wrong</black>"
      page-2: "<dark_blue><bold>1. What FTCA does</bold></dark_blue>\n<black>FTCA dispatches trains to the timetable, sets routes and controls signals. Players can take over these trains: dispatch gives movement authority and stops; the driver drives smoothly, stops accurately, works the doors and keeps time.</black>"
      page-3: "<dark_blue><bold>2. Operating licence</bold></dark_blue>\n<black>The operating licence lists three posts side by side: driver, guard and signaller.\nDriver level 1 learner: finish the tutorial; drive non-dispatched trains.\nLevel 2 driver: practise on a dispatched train you board, then take the road test.\nGuard and signaller: see their own handbooks.</black>\n<dark_gray>/fta license</dark_gray>"
      page-4: "<dark_blue><bold>3. Tasks and taking over</bold></dark_blue>\n<black>At a station run /fta drive tasks: left-click for manual, right-click for ATO. When the train arrives, sit in the leading cab, confirm your seat and run /fta drive on. If you are not in the driver's seat, a chat button can move you there.</black>"
      page-5: "<dark_blue><bold>4. The cab</bold></dark_blue>\n<black>Hotbar 1–3 power P3–P1, 4 coast N, 5–8 brake B1–B4, 9 emergency EB.\nOnce stopped, F opens the cab panel (doors, end driving).\nAction bar: speed and limit.\nSidebar: signal, stop, times, doors.</black>"
      page-6: "<dark_blue><bold>5. Signals and speed</bold></dark_blue>\n<black>The sidebar signal is your authority: proceed at the limit; caution/slow means reduce speed; stop means stop ahead. Right-click to acknowledge a restrictive signal.\nThe advised speed in the boss bar follows the timetable curve; follow it to keep time.</black>"
      page-7: "<dark_blue><bold>6. Stopping and doors</bold></dark_blue>\n<black>The sidebar shows metres to the stop mark. Brake early and stop within the door range, ideally on the mark; move up if short, you cannot reverse. At termini, overrunning by over 3 m forces a stop.\nOnce stopped, press F and open the platform side.</black>"
      page-8: "<dark_blue><bold>7. Departing on time</bold></dark_blue>\n<black>Depart once the doors are closed and the signal allows; early starts are blocked. With a guard aboard, the guard works the doors: wait for the guard's signal.\nThe sidebar shows times and delay; recover lateness within the limit. Scores come at the end.</black>"
      page-9: "<dark_blue><bold>8. Termini and changing ends</bold></dark_blue>\n<black>At the terminus the trip is scored when the doors open; end driving or carry on with the next trip.\nTo change ends, walk to the other cab with the doors open; unmarked seats need confirming. ATO changes ends too.</black>"
      page-10: "<dark_blue><bold>9. When things go wrong</bold></dark_blue>\n<black>If held, wait for the signal; Q twice calls the signaller (with a guard aboard: /fta drive call). Use EB only to stop at once. Leaving the seat ends driving, except walking to the other cab at a terminus. Hand back to automatic if stuck.</black>\n<dark_gray>More: Fetarute Wiki.</dark_gray>"
