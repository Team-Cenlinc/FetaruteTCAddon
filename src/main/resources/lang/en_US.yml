    push: "  <white>Shift+right-click an end car with an open coupler</white> <gray>Push the whole train slowly to the train ahead and couple; the facing coupler of that train must be open</gray>"
    couple: "  <white>Click [Couple] in chat after opening a coupler</white> <gray>This train moves slowly to the train ahead and couples; the facing coupler of that train is opened as well</gray>"
