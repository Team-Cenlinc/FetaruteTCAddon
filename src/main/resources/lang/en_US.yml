          rule: "<prefix> <white>Rules: </white><gray>do the practice steps yourself without pressing Skip; press Continue on explanation steps; ending the drive on the last step completes the tutorial.</gray>"
          perm: "<prefix> <gray>Driving non-dispatched trains is enabled for the exam and withdrawn afterwards.</gray> <click:run_command:'/fta handbook driver'><hover:show_text:'<gray>Get the driver handbook</gray>'><aqua>[Driver handbook]</aqua></hover></click>"
        road-test:
          header: "<prefix> <gold><bold>Level <level> · <name> road test</bold></gold>"
          route: "<prefix> <white>Exam train: <line> to <yellow><destination></yellow>, leaving <yellow><takeover></yellow><platform> at <yellow><time></yellow>; drive <stops> stops and hand over at <yellow><handover></yellow>.</white> <gray>Trip <trip></gray>"
          pass: "<prefix> <white>To pass: </white><gray>score at least <min>, drive manually throughout.</gray>"
          no-emergency: "<prefix> <gray>· no protective emergency braking (speeding, passing a stop signal)</gray>"
          no-overrun: "<prefix> <gray>· stop within the door range at every station; no overruns or skips</gray>"
          no-wrong-door: "<prefix> <gray>· only open the platform-side doors</gray>"
          how: "<prefix> <white>How: </white><gray>when the train arrives, sit in the leading cab, confirm your seat and run <aqua>/fta drive on</aqua>.</gray> <click:run_command:'/fta drive task goto'><hover:show_text:'<gray>Teleport to the takeover platform; if the train is already in, right beside the leading cab</gray>'><green>[Go to takeover]</green></hover></click>"
          handbook: "<prefix> <white>Study: </white><gray>the FTCA driver handbook is in your inventory; read it before taking over, the road test is judged on its points.</gray>"
          feedback: "<prefix> <gray>Each stop is reviewed as you go, and anything that fails the test is reported immediately.</gray>"
        signaller:
          header: "<prefix> <gold><bold><name> exam</bold></gold> <gray>signed up; go on duty at any signal box console within <white><window></white> min</gray>"
          how: "<prefix> <white>Going on duty:</white><gray> right-click the console screen, then confirm with <white>/fta signal on</white>; the zone switches to manual. You hold signaller permission during the exam.</gray>"
          pass: "<prefix> <white>Finishing:</white><gray> from going on duty, set routes yourself for <white><trains></white> trains (counted when the train enters the zone; auto-pass routes do not count); one simulated call will come in and needs a fitting reply. Out of 100, each train routed by the system after waiting too long, each unanswered call and each reply that does not fit costs <white><penalty></white>; pass mark <white><min></white>.</gray>"
          fail: "<prefix> <white>Instant fail:</white><gray> falling below the pass mark; switching to auto; several trains unattended so the system switches to auto. Going off duty early or running out of time does not count and you may retry at once. The shift ends when the exam does; go on duty again to keep signalling.</gray>"
          handbook: "<prefix> <gray>The FTCA Signaller Handbook is in your inventory; run /fta handbook signaller for another copy.</gray>"
