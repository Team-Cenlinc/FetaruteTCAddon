        subtitle: "<yellow>将手柄置于 P1–P3（1–3 号位）起步</yellow>"
      traction-dispatch:
        chat: "<white>起步：</white><gray>调度列车须按信号行车。动作栏出现发车信号后，再将手柄置于 P1–P3（1–3 号位）起步，车速不得超过动作栏显示的限速。</gray>"
        subtitle: "<yellow>出现发车信号后将手柄置于 P1–P3 起步</yellow>"
      coast:
        chat: "<white>惰行：</white><gray>回到 N（4 号位）切断牵引，列车凭惯性滑行。行车中保持车速时常用惰行。</gray>"
        subtitle: "<yellow>回到 N（4 号位）惰行</yellow>"
      service-brake:
        chat: "<white>常用制动：</white><gray>快捷栏 5–8 号位为 B1–B4，数字越大制动力越大。请用常用制动减速，把列车停稳。</gray>"
        subtitle: "<yellow>用 B1–B4（5–8 号位）减速并停稳</yellow>"
      service-brake-dispatch:
        chat: "<white>常用制动：</white><gray>快捷栏 5–8 号位为 B1–B4，数字越大制动力越大。遇到停车信号或进站时，请用常用制动提前减速并停稳。</gray>"
        subtitle: "<yellow>用 B1–B4（5–8 号位）减速并停稳</yellow>"
      emergency-brake:
        chat: "<white>紧急制动：</white><gray>快捷栏 9 号位为 EB，制动力最大，施加后须停稳才能缓解。EB 仅限紧急情况使用，行车中不得误触。</gray>"
        subtitle: "<red>EB（9 号位）仅限紧急情况</red>"
      open-doors:
        chat: "<white>开门：</white><gray>停稳后按</gray> <yellow>F</yellow> <gray>打开驾驶台，点击第一排的左车门或右车门开门；左右以驾驶员面朝的方向为准。</gray>"
        subtitle: "<yellow>按 F 打开驾驶台，打开车门</yellow>"
      close-doors:
        chat: "<white>关门：</white><gray>再次点击车门按钮关门。车门未关好时不能牵引，关门动画结束后才算关好。</gray>"
        subtitle: "<yellow>关闭车门</yellow>"
      finish:
        chat: "<white>结束驾驶：</white><gray>停车后按</gray> <yellow>Shift</yellow> <gray>离座，或输入 /fta drive off 结束驾驶；列车行驶中不能离座。结束驾驶即完成教程。</gray>"
        subtitle: "<yellow>停车后按 Shift 离座结束驾驶</yellow>"
      finish-dispatch:
        chat: "<white>完成任务：</white><gray>请按信号开到终点站，停稳后列车自动交还自动运行，任务完成即完成教程。中途离座或输入 /fta drive off 将记为放弃任务。</gray>"
        subtitle: "<yellow>按信号开到终点站</yellow>"
