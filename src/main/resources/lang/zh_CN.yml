      setup-switches:
        chat: "<white>启动列车：</white><gray>按</gray> <yellow>F</yellow> <gray>打开驾驶台，按动作栏「下一步」的提示，在第二排依次接通钥匙、受电、主断路器与辅助电源；每一项接通需要数秒。</gray>"
        subtitle: "<yellow>按 F 打开驾驶台，按「下一步」逐项接通</yellow>"
      compressor:
        chat: "<white>打开压缩机：</white><gray>机车牵引的压缩机须手动打开。请在驾驶台点击压缩机开关，此后主风缸压力不足时压缩机自动运转。</gray>"
        subtitle: "<yellow>在驾驶台打开压缩机</yellow>"
      brake-test:
        chat: "<white>制动试验：</white><gray>在驾驶台点击制动试验，关闭驾驶台菜单后将手柄置于 B4（8 号位）或以上，制动缸升压后再将手柄置于 N（4 号位）缓解。试验通过前不能牵引。</gray>"
        subtitle: "<yellow>点击制动试验，手柄置于 B4 再置于 N</yellow>"
      release-parking:
        chat: "<white>缓解停放制动：</white><gray>请在驾驶台点击停放制动将其缓解。停放制动施加时不能牵引，缓解需要足够的主风缸压力。</gray>"
        subtitle: "<yellow>在驾驶台缓解停放制动</yellow>"
      reverser:
        chat: "<white>确认换向手柄：</white><gray>换向手柄决定行驶方向，须在前进位才能向前牵引，零位时不能牵引。停稳且车门关闭时，可在驾驶台第一排切换，也可输入 /fta drive reverser forward。</gray>"
