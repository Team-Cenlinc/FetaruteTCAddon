  conflict-hover-teleport: "<gray>点击传送：</gray> <white><cmd></white>"
  removed: "<prefix> <dark_aqua>已移除</dark_aqua> <white><type></white> <dark_aqua>节点</dark_aqua> <white><node></white>"
  stopmark:
    created: "<prefix> <dark_aqua>已设置停车位置标：</dark_aqua><white><carriages></white> <dark_aqua>节编组列车的车头最前端在此停车</dark_aqua>"
    created-doors: "<prefix> <dark_aqua>已设置停车位置标：</dark_aqua><white><carriages></white> <dark_aqua>节编组列车的车头最前端在此停车，仅自车头起第</dark_aqua> <white><doors></white> <dark_aqua>节车厢开关门</dark_aqua>"
    invalid: "<prefix> <red>停车位置标格式无效</red> <gray>第三行写 car:节数（亦可写 carriage:），例如 car:4、car:4,6、car:3-5、car:*；第四行可选写 door:开关门的车厢（自车头起算，写法同上），例如 door:1；适用的最短编组也须至少有一节开门车厢</gray>"
    no-permission: "<prefix> <red>无权设置停车位置标</red>"
  type:
    depot: "车库"
    depot_throat: "车库咽喉"
    station: "站点"
    station_throat: "站咽喉"
    waypoint: "区间点"
    destination: "目的地"
    switcher: "道岔"

graph:
  alert:
    stale: "<prefix> <red>调度图已失效</red> <gray>世界</gray> <white><world></white><gray>：节点牌子移除</gray> <white><removed></white> <gray>处、新增</gray> <white><added></white> <gray>处。重建前该世界的调度无法使用调度图，开启跨世界时经过该世界的交路也受影响。</gray>"
    retained: "<prefix> <yellow>调度图与节点牌子不一致</yellow> <gray>世界</gray> <white><world></white><gray>：节点牌子移除</gray> <white><removed></white> <gray>处、新增</gray> <white><added></white> <gray>处，均无交路使用，调度继续使用原图。新增的节点要重建后才会纳入调度。</gray>"
    entry: "<gray>  - <action></gray> <white><type></white> <white><node></white> <gray>@ <x>, <y>, <z></gray>"
    entry-used: "<gray>  - <action></gray> <white><type></white> <white><node></white> <gray>@ <x>, <y>, <z></gray> <red>（<usage>）</red>"
    action-removed: "移除"
    action-added: "新增"
    more: "<gray>  …另有</gray> <white><count></white> <gray>处</gray>"
    hint: "<gray>请到该世界执行</gray> <click:suggest_command:'/fta graph build'><hover:show_text:'<gray>点击填入</gray>'><white>/fta graph build</white></hover></click><gray>；若属误删，在原位置按原文字手动放回牌子也可恢复。</gray>"
    recovered: "<prefix> <green>调度图已恢复</green> <gray>世界</gray> <white><world></white><gray>：节点牌子与快照重新一致，已重新载入调度图。</gray>"
    join-retained: "<prefix> <yellow>世界</yellow> <white><world></white> <yellow>的调度图与节点牌子不一致，调度仍在使用原图，建议重建。</yellow>"
    join: "<prefix> <yellow>世界</yellow> <white><world></white> <yellow>的调度图处于失效状态，重建前该世界的调度无法使用调度图，开启跨世界时经过该世界的交路也受影响。</yellow>"

