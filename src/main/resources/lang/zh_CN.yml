prefix: "<gray>[<dark_aqua>FTA</dark_aqua>]</gray>"

common:
  "yes": "是"
  "no": "否"

locale:
  loaded: "<prefix> 语言 <dark_aqua><locale></dark_aqua> 已加载"
  fallback: "<prefix> 未找到语言文件 <red><locale></red>，已回退到 <dark_aqua><fallback></dark_aqua>"
  reloaded: "<prefix> <dark_aqua>已重新加载语言文件</dark_aqua>"

error:
  missing-key: "<prefix> 缺少语言键 <red><key></red>"
  no-permission: "<prefix> <red>你没有权限执行此命令</red>"
  storage-unavailable: "<prefix> <red>存储后端尚未就绪，稍后重试或检查控制台日志</red>"

display:
  hud:
    eta:
      status:
        arriving: "即将到达"
        delayed: "延误 {minutes}分"
        scheduled: "预计 {minutes}分"
        minutes: "{minutes}分"
        unavailable: "-"
    bossbar:
      template: |-
        rotate_ticks: 60
        AT_STATION_1: <{line_color_tag}>▋<white> {line}</white><gray> | </gray><white>本站 {current_station}，开往 {dest_eor}</white>
        AT_STATION_2: <{line_color_tag}>▋<white> {line}</white><gray> | </gray><white>下一站 {next_station}，开往 {dest_eor}</white>
        AT_LAST_STATION: <{line_color_tag}>▋<white> {line}</white><gray> | </gray><white>终点站 {current_station} 到达</white>
        DEPARTING: <{line_color_tag}>▋<white> {line}</white><gray> | </gray><white>即将离站，前往 {next_station}</white>
        ARRIVING: <{line_color_tag}>▋<white> {line}</white><gray> | </gray><white>即将到达 {next_station}</white>
        TERM_ARRIVING: <{line_color_tag}>▋<white> {line}</white><gray> | </gray><white>终点 {next_station} 到达</white>
        IN_TRIP_1: <{line_color_tag}>▋<white> {line}</white><gray> | </gray><white>下一站 {next_station}</white><gray> | </gray><white>{eta_status}</white>
        IN_TRIP_2: <{line_color_tag}>▋<white> {line}</white><gray> | </gray><white>车厢 {player_carriage_no}/{player_carriage_total}</white><gray> | </gray><white>速度 {speed}</white>
        ON_LAYOVER_1: <{line_color_tag}>▋<white> {line}</white><gray> | </gray><white>折返待命中</white>
        ON_LAYOVER_2: <{line_color_tag}>▋<white> {line}</white><gray> | </gray><white>即将换向，等待调度</white>
        IDLE_1: <{line_color_tag}>▋<white> {line}</white><gray> | </gray><white>临时停车</white>
        IDLE_2: <{line_color_tag}>▋<white> {line}</white><gray> | </gray><white>等待信号中</white>
        OUT_OF_SERVICE: <{line_color_tag}>▋<white> {line}</white><gray> | </gray><white>回库，不再载客</white>
      label:
        line: "线路"
        next: "下一站"
      unit:
        kmh: "km/h"
      signal:
        proceed: "通行"
        proceed_with_caution: "注意"
        caution: "注意"
        stop: "停车"
        unknown: "-"
      service:
        in_service: "营运中"
        layover: "待命"
      tc_destination:
        empty: "暂无目的地"
    actionbar:
      template: |-
        rotate_ticks: 80
        AT_STATION_1: <white>欢迎乘坐 {operator} 列车，本站 {current_station}</white>
        AT_STATION_2: <white>本线路 {line} 前往 {dest_eop}</white>
        AT_STATION_3: <white>Welcome aboard {operator} | Line {line} to {dest_eop_lang2}</white>
        AT_LAST_STATION: <yellow>终点站 {current_station} 到达</yellow>
        DEPARTING: <white>前往 {next_station}</white>
        ARRIVING: <yellow>即将到达 {next_station}</yellow>
        TERM_ARRIVING: <yellow>终点 {next_station} 到达</yellow>
        ON_LAYOVER: <white>折返待命中</white>
        IDLE: <white>临时停车</white>
        OUT_OF_SERVICE: <white>本列车回库，不再载客</white>
        <white>欢迎乘坐 {company}/{operator} 列车</white>
        <white>本次列车为 {line} 列车，前往 {dest_eop}</white>
        <white>下一站 {next_station}</white>
        <white>Welcome aboard {operator} train</white>
        <white>Line {line} to {dest_eop_lang2}</white>
        <white>Next stop {next_station_lang2}</white>
      tc_destination:
        empty: "暂无目的地"
  # 后续站点对话框（乘车时按副手交换键或 /fta trip 打开）。
  # title/summary/row.* 与 HUD 模板同一写法：{key} 占位符 + MiniMessage；{?key} 缺值时整行省略。
  # 行内占位符同车内显示屏的列表行（station、station_lang2、eta、transfer_lines、delay_minutes 等），
  # 另有 line_change：直通运转在这一站换到另一条线时为新线路名。
  trip:
    title: "<{line_color_tag}>█</{line_color_tag}> <white>{line}</white> <gray>·</gray> <white>{route_pattern}</white> <gray>·</gray> <white>开往 {dest_eop}</white>"
    summary: "<gray>列车 {train_name} · 共 {player_carriage_total} 节 · 您在第 {player_carriage_no} 节</gray>"
    row:
      next: "<green>下一站</green> <yellow>{station}</yellow> <gray>{eta}</gray>"
      stop: "<white>{station}</white> <gray>{eta}</gray>"
      terminal: "<gold>终点</gold> <white>{station}</white> <gray>{eta}</gray>"
      details:
        - "<gray>{?station_lang2}</gray>"
        - "<gray>换乘</gray> {?transfer_lines}"
        - "<yellow>晚点 {?delay_minutes} 分钟</yellow>"
        - "<aqua>⇄</aqua> <gray>本站起改为</gray> <{line_color_tag}>█</{line_color_tag}><white>{?line_change}</white> <gray>运行</gray>"
    empty: "<gray>前方没有停靠站。</gray>"
    more: "<gray>另有 <count> 站未列出。</gray>"
    not-on-train: "<prefix> <gray>请在乘坐列车时查看后续站点。</gray>"
    unavailable: "<prefix> <red>后续站点暂不可用：</red><gray>展示服务未启动。</gray>"
    button:
      refresh: "刷新"
      transfers-only: "只看换乘站"
      show-all: "显示全部站"
      close: "关闭"

sign:
  created: "<prefix> <dark_aqua>已注册</dark_aqua> <white><type></white> <dark_aqua>节点</dark_aqua> <white><node></white>"
