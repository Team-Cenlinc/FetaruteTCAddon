  handbook:
    guard:
      title: "FTCA 车掌手册"
      author: "Fetarute"
      given: "<prefix> <green>《FTCA 车掌手册》已放进背包</green>"
      page-1: "<dark_blue><bold>FTCA 车掌手册</bold></dark_blue>\n\n<black>一、上岗与座位\n二、站停作业\n三、关门与监视\n四、发车铃与紧急停车\n五、终点与成绩\n六、练习与考试</black>"
      page-2: "<dark_blue><bold>一、上岗与座位</bold></dark_blue>\n<black>坐进调度列车车尾的驾驶室，输入 /fta guard on 上岗（单节车坐另一头）；也可在车站输入 /fta guard tasks 领一班车掌，车到站后坐进车尾即上岗。车掌座位为你预留，他人不能坐。快捷栏换成车掌按钮，选中后右键使用，F 打开车掌菜单；/fta guard off 结束值乘。</black>"
      page-3: "<dark_blue><bold>二、站停作业</bold></dark_blue>\n<black>停妥后右键开门格开站台一侧的车门（1 左、2 右，以你面朝的方向为准），随后可下车到站台。停站时间到后右键 3 关门。开门限 30 秒、关门限 15 秒，超时由站台代做；连续 3 站超时，值乘结束。夹人夹物等情况右键 4 报告，时限延长 30 秒。</black>"
      page-4: "<dark_blue><bold>三、关门与监视</bold></dark_blue>\n<black>关门时站在站台上、靠近自己那节车门，视线沿车身注视车门，直到车门关好。门全关后回到车掌座位。列车起步后朝站台一侧或车后看，直到车尾离开站台。两项监视计入成绩。</black>"
      page-5: "<dark_blue><bold>四、发车铃与紧急停车</bold></dark_blue>\n<black>回座后，出站信号开放时右键 6 确认，再在 7 上按住右键约一秒（一长声）发出发车信号；一短为收到，一秒内右键两下为呼叫驾驶员。出站信号未开放时不计时。遇危险右键 9 紧急停车，停稳后再发一长声解除。</black>"
      page-6: "<dark_blue><bold>五、终点与成绩</bold></dark_blue>\n<black>终点站折返时换到另一头的驾驶室；驾驶员换端时两人一同换座，时间不足时直接送入。每站作业计分：超时、开错门各扣 5 分，提前关门、监视不合格各扣 2 分；异常报告不扣分。</black>"
      page-7: "<dark_blue><bold>六、练习与考试</bold></dark_blue>\n<black>练习：坐上要练习的调度列车（停站中或在终点站待命），输入 /fta license practice guard，从这一站起值乘规定站数，逐站讲评。\n考试：练习后在车站输入 /fta license exam guard，系统指派车次；超时、开错门即不及格，有一站演练夹人夹物。</black>"
    driver:
      title: "FTCA 驾驶员手册"
      author: "Fetarute"
      given: "<prefix> <green>《FTCA 驾驶员手册》已放进背包</green>"
      page-1: "<dark_blue><bold>FTCA 驾驶员手册</bold></dark_blue>\n\n<black>一、FTCA 是什么\n二、驾驶证\n三、领任务与接班\n四、驾驶台\n五、信号与控速\n六、进站与车门\n七、发车与正点\n八、终点与换端\n九、异常处置</black>"
      page-2: "<dark_blue><bold>一、FTCA 是什么</bold></dark_blue>\n<black>FTCA 按时刻表自动派车、排进路、控制信号。玩家可以接班驾驶这些列车：调度给出行车许可与停站要求，驾驶员负责平稳行车、停准、开关车门、准点到发。</black>"
      page-3: "<dark_blue><bold>二、驾驶证</bold></dark_blue>\n<black>第 1 级 见习驾驶证：完整做完新手教程即可取得，可驾驶非调度列车。\n第 2 级 正式驾驶证：先坐上调度列车练习，再在车站报名路考，及格取得，可领任务驾驶调度列车。\n附注 车掌：另行考取，见《车掌手册》。\n驾驶证全服通用。</black>\n<dark_gray>查看与报名：/fta license</dark_gray>"
      page-4: "<dark_blue><bold>三、领任务与接班</bold></dark_blue>\n<black>在车站输入 /fta drive tasks 打开任务板：左键人工驾驶，右键 ATO。列车到站后坐进车头驾驶室，确认座位后输入 /fta drive on 接班；未坐在驾驶座时，可点聊天栏的按钮传送入座。</black>"
      page-5: "<dark_blue><bold>四、驾驶台</bold></dark_blue>\n<black>快捷栏 1–3 牵引 P3–P1，4 惰行 N，5–8 制动 B1–B4，9 紧急制动 EB。\n停稳后按 F 打开驾驶台菜单（开关车门、结束驾驶等）。\n动作栏：车速与限速。\n侧边栏：信号、停站、时刻、车门。</black>"
      page-6: "<dark_blue><bold>五、信号与控速</bold></dark_blue>\n<black>侧边栏「信号」给出行车许可：允许时按限速行车；注意、减速时降速；停车时须在信号前停车。信号变严时按提示右键确认。\nBoss 栏的建议速度按时刻表的运行曲线给出，跟着它驾驶即可准点。</black>"
      page-7: "<dark_blue><bold>六、进站与车门</bold></dark_blue>\n<black>侧边栏「停车点」显示剩余米数。提早减速，停在可开门范围内即合格，停准为佳；欠标可前移对标，过标后不得退行。终点站最多越过停车点 3 米，超出即强制停车。\n停稳后按 F 开站台一侧的车门，停站计时结束后关门。</black>"
      page-8: "<dark_blue><bold>七、发车与正点</bold></dark_blue>\n<black>车门关好、出站信号允许后起步，提前起步将被制止。\n有车掌时车门由车掌开关，等车掌的发车信号再起步。\n侧边栏显示表定时刻与正晚点，晚点时可在限速内追回。\n每站成绩与全程得分在结束时给出。</black>"
      page-9: "<dark_blue><bold>八、终点与换端</bold></dark_blue>\n<black>到终点站开门后结算本趟成绩，可以结束驾驶，也可以接着驾驶本车的下一趟。\n需要换端时，车门可以开着，走到另一端驾驶室坐下；驾驶座未标记的列车须确认座位。ATO 下同样须换端，坐好后列车自动发车。</black>"
      page-10: "<dark_blue><bold>九、异常处置</bold></dark_blue>\n<black>被调度扣停时等待信号，不要强行起步。紧急制动只在必须立即停车时使用。行驶中不能离座；终点站等下一趟时可离座走到发车端，其余情况离座即结束驾驶；列车无法运行时可交还自动运行。</black>\n<dark_gray>完整内容见 Fetarute Wiki《驾驶员手册》。</dark_gray>"
