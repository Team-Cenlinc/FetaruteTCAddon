  tutorial:
    offer: "<prefix> <gold>初次驾驶</gold> <gray>新手教程将在本次驾驶中逐步引导启动列车、起步、惰行、制动停车与开关车门，每完成一步自动进入下一步。</gray> <click:run_command:'/fta drive tutorial start'><hover:show_text:'<gray>点击执行：</gray> <white>/fta drive tutorial start</white>'><green>[开始新手教程]</green></hover></click> <click:run_command:'/fta drive tutorial stop'><hover:show_text:'<gray>此后不再自动提示；可随时输入 /fta drive tutorial start 开始</gray>'><gray>[跳过]</gray></hover></click>"
