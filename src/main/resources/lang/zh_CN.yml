      continue: "<click:run_command:'/fta drive tutorial skip'><hover:show_text:'<gray>进入下一步（稍后也将自动继续）</gray>'><green>[继续]</green></hover></click> <click:run_command:'/fta drive tutorial stop'><hover:show_text:'<gray>退出教程，此后不再自动提示</gray>'><gray>[退出教程]</gray></hover></click>"
      finish: "<click:run_command:'/fta drive tutorial skip'><hover:show_text:'<gray>不结束驾驶，直接完成教程</gray>'><green>[完成教程]</green></hover></click>"
