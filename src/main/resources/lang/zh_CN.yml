      setup-switches:
        chat: "<white>启动列车：</white><gray>按</gray> <yellow>F</yellow> <gray>打开驾驶台，按动作栏「下一步」的提示，在第二排依次接通钥匙、受电、主断路器与辅助电源；每一项接通需要数秒。</gray>"
        subtitle: "<yellow>按 F 打开驾驶台，按「下一步」逐项接通</yellow>"
      compressor:
        chat: "<white>打开压缩机：</white><gray>机车牵引的压缩机须手动打开。请在驾驶台点击压缩机开关，此后主风缸压力不足时压缩机自动运转。</gray>"
