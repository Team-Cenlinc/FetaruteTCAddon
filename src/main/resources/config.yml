# 配置版本，由插件维护，请勿修改
config-version: 38

# 界面语言，对应 lang/ 目录下的文件名（如 zh_CN、en_US）
locale: zh_CN

# 本服的服务器 ID（跨服预留）。单服留空；多服时每台服务器不同，跨边界的引用写成“服务器 ID + 节点 ID”
server-id: ""

debug:
  # 是否输出调试日志
  enabled: false
  # 每分钟最多输出的调度观察类诊断条数；停车原因、资源变化等关键审计不受此限制，始终输出。
  # 排查拥堵或死锁时可临时调高到 1200~3000，排查结束后请改回，否则日志量会随列车数成倍增长。
  observation-budget-per-minute: 120

# 智能调度器：在拥堵、互卡时尝试解锁与恢复
smart-dispatcher:
  # 运行模式：OFF = 关闭；OBSERVE_ONLY = 只记录决策、不执行；ENFORCE = 执行通过安全审查的动作。
  # 健康监控的自动恢复与清车（health.deadlock-destroy-enabled）只在 ENFORCE 下实际生效，长期运行的服务器建议设为 ENFORCE。
  mode: OBSERVE_ONLY
  # 前向规划器：为疏解拥堵临时预约前方资源。以下参数一般无需调整。
  planner:
    enabled: true
    # 运行模式：OFF = 关闭；OBSERVE_ONLY = 只记录规划结果、不创建预约；
    # ENFORCE_MINIMAL_FORWARD = 执行同向、短窗口、可回滚的最小前向解锁（需 smart-dispatcher.mode 为 ENFORCE）
    mode: OBSERVE_ONLY
    # 单次预约最多包含的资源数
    max-reservation-resources: 4
    # 解锁预约的有效期（信号 tick，1 tick = 50 毫秒，1200 = 60 秒）。
    # 需长于被让行列车实际驶离、让出资源所需的时间，调得过短会让预约在生效前就过期。
    reservation-ttl-ticks: 1200
    # 阻塞关系快照的有效期（毫秒）
    blocker-snapshot-ttl-ms: 10000
    # 只为同方向的列车预约
    require-same-direction: true
    # 是否允许为反方向列车预约
    allow-reverse: false
    # 是否允许在授权边界之前折返
    allow-turnback-before-boundary: false
    # 每个规划周期最多保留一个生效中的预约
    one-active-reservation-per-cycle: true

# 健康监控：发现静止、停滞与互卡的列车，并自动恢复或清理
health:
  # 是否启用健康监控
  enabled: true
  # 检查间隔（秒）
  check-interval-seconds: 5
  # 是否自动修复；关闭后只告警
  auto-fix-enabled: true
  # 有放行信号却静止超过该秒数时告警并尝试恢复
  stall-threshold-seconds: 30
  # 进度（经过的路径点）超过该秒数没有推进时告警
  progress-stuck-threshold-seconds: 60
  # 停在红灯（STOP）下时额外给予的宽限秒数，用于区分正常排队与异常停滞
  progress-stop-grace-seconds: 60
  # 红灯下停滞超过该秒数时，优先尝试解开两车互卡
  deadlock-threshold-seconds: 45
  # 销毁类清理总开关：同时控制"互卡销毁"与"长时间停滞清车"。
  # 关闭时卡死的列车只能手动删除；长期运行的服务器建议开启（还需 smart-dispatcher.mode 为 ENFORCE）。
  # 停滞告警里的"清车=…"会说明清车为何没有执行，例如在等哪一列车、那列车处于什么状态。
  deadlock-destroy-enabled: false
  # 互卡持续超过该秒数仍未恢复时，销毁其中一列；0 表示不销毁
  deadlock-destroy-threshold-seconds: 60
  # 同一对互卡列车两次销毁之间的冷却（秒），避免连续销毁两列
  deadlock-destroy-cooldown-seconds: 120
  # 空车停滞超过该秒数、且自动恢复无效后，可被清车。几列车首尾相接互相等待时，也会清理其中一列
  stuck-cleanup-threshold-seconds: 600
  # 载客列车的清车阈值（秒），不得低于空车阈值；空车总是先于载客列车被清理
  stuck-cleanup-passenger-threshold-seconds: 1800
  # 两次停滞清车之间的冷却（秒）；每次检查最多清理一列
  stuck-cleanup-cooldown-seconds: 120
  # 互卡判定的细节参数（秒），一般无需调整：阻塞证据短暂缺失时的保留时长、判定互卡前的最短静止时长、阻塞快照的有效期
  deadlock-episode-grace-seconds: 15
  deadlock-min-stop-seconds: 20
  blocker-snapshot-max-age-seconds: 20
  # 两次自动恢复动作之间的冷却（秒）
  recovery-cooldown-seconds: 10
  # 残留占用的超时时间（分钟）
  occupancy-timeout-minutes: 5
  # 是否清理已消失列车遗留的占用
  orphan-cleanup-enabled: true
  # 是否清理超时的残留占用
  timeout-cleanup-enabled: true

graph:
  # 未设置限速的区间使用的默认线路速度（格/秒）。控车、编排时刻表与到站预测共用，修改后需重新编排时刻表
  default-speed-blocks-per-second: 8.0
  # 节点牌子寻找所属轨道的搜索半径（格）
  sign-anchor-search-radius: 6
  # 道岔（switcher）牌子寻找所属轨道的搜索半径（格）
  switcher-anchor-search-radius: 2
  # 跨世界（实验）：把 TrainCarts 的 [portal] 牌子（MyWorlds 传送门）建成图节点，并可用 /fta graph portal 把两边的门连起来。
  # 关闭时传送门牌子不进图，与旧版行为一致；改动后需重建调度图
  cross-world: false

autostation:
  # 关门提示音（Bukkit Sound 名称或自定义声音键）
  door-close-sound: "BLOCK_NOTE_BLOCK_BELL"
  # 关门提示音音量
  door-close-sound-volume: 1.0
  # 关门提示音音高
  door-close-sound-pitch: 1.2

runtime:
  # 信号与闭塞检查的间隔（ticks，20 ticks = 1 秒）
  dispatch-tick-interval-ticks: 50
  # 发车、加速动作的最短间隔（ticks），0 表示不限制
  launch-cooldown-ticks: 10

  hud:
    # 双语轮播时中英文的切换周期（ticks）。BossBar、ActionBar 与车内显示屏共用该周期，保证三者同时显示同一种语言；
    # 只有一种语言的内容仍按各模板自身的 rotate_ticks / page_duration_ticks 轮播
    language-rotate-ticks: 60
    bossbar:
      # 是否在车上显示 BossBar 信息栏
      enabled: true
      # 刷新间隔（ticks）
      tick-interval-ticks: 10
      # 标题模板（MiniMessage），留空使用 default_hud_template.yml
      # 可用占位符: {label_line} {line} {line_code} {line_name} {line_color} {line_color_tag} {operator}
      #        {company} {company_code} {company_name}
      #        {route_code} {route_id} {route_name} {dest_eor} {dest_eor_code} {dest_eor_lang2}
      #        {dest_eop} {dest_eop_code} {dest_eop_lang2} {current_station} {current_station_code} {current_station_lang2}
      #        {label_next} {next_station} {next_station_code} {next_station_lang2}
      #        {eta_status} {eta_minutes} {speed} {speed_kmh} {speed_bps} {speed_unit}
      #        {signal_status} {signal_aspect} {service_status} {progress} {progress_percent}
      #        {train_name} {layover_wait} {player_carriage_no} {player_carriage_total}
      #        {transfer_lines} {transfer_line_names} {transfer_line_names_lang2} {delay_minutes} {trip_dialog_key}
      # 写成 {?key} 时为条件占位符：值缺失（空或 -）时整行不显示，用于只在有换乘、晚点时才出现的行
      template: ""
    actionbar:
      # 是否在车上显示 ActionBar 信息
      enabled: true
      # 刷新间隔（ticks）
      tick-interval-ticks: 10
      # 模板（MiniMessage），留空使用 default_hud_template.yml；占位符同 BossBar，支持按状态分支（如 ARRIVING / TERM_ARRIVING）
      template: ""
    player_display:
      # 是否启用车内计分板显示屏
      enabled: true
      # 刷新间隔（ticks）
      tick-interval-ticks: 10
      # 模板（YAML + MiniMessage），留空使用 default_hud_template.yml
      template: ""
    trip-dialog:
      # 乘坐 FTA 列车时按副手交换键（默认 F）打开后续站点对话框；乘车期间该键不再交换副手物品，下车后恢复。
      # 关闭后乘客仍可用 /fta trip 打开。对话框需要 1.21.6 及以上的客户端
      swap-hand-key: true
  # 占用申请向前查看的区间数
  lookahead-edges: 3
  # 同向跟车时与前车之间至少空出的区间数
  min-clear-edges: 2
  # 车尾保护：保留整列车身所在区间，另加车尾之后的区间数；车长未知时保留全部可确认的后方路径
  rear-guard-edges: 1
  # 道岔区联锁范围（向前的区间数）
  switcher-zone-edges: 3
  # 进站及停车路径点前的限速（格/秒）
  approach-speed-bps: 10.0
  # 进入车库前的限速（格/秒）
  approach-depot-speed-bps: 5.0
  # 进站限速区范围（格）：距下一个进站触发点（车站、车库及其咽喉、紧邻的道岔）不超过该距离的节点起按进站限速运行，
  # 区外按车型减速度提前制动到区起点。编排时刻表与到站预测使用同一规则，修改后需重新编排时刻表；0 表示不按距离划区
  approach-window-blocks: 96.0
  # 距进站触发点的区间数不超过该值时也划入进站限速区；0 表示不按区间数判断
  approach-window-edges: 0
  # 注意（CAUTION）信号下的限速（格/秒），可按连通分量单独覆盖
  caution-speed-bps: 10.0
  # 是否根据剩余距离与制动能力提前减速
  speed-curve-enabled: true
  # 停车曲线类型：physics / linear / quadratic / cubic
  speed-curve-type: "physics"
  # 停车曲线放大系数（大于 1 更激进，小于 1 更保守），只作用于在阻塞点或授权终点前停车；前方限速与进站区外制动按车型减速度计算
  speed-curve-factor: 1.0
  # 提前减速的额外缓冲距离（格）
  speed-curve-early-brake-blocks: 0.0
  # 是否启用移动授权：可行驶距离不足时主动降级信号并限速
  movement-authority-enabled: true
  # 停车余量（格）：制动距离加该余量超过可行驶距离时强制停车
  movement-authority-stop-margin-blocks: 2.0
  # 注意余量（格）：制动距离加该余量超过可行驶距离时降级为注意信号
  movement-authority-caution-margin-blocks: 8.0
  # 目标速度变化小于该值（格/秒）时不更新，避免速度指令抖动
  speed-command-hysteresis-bps: 0.15
  # 提速限幅系数，相对列车加速度（1.0 表示与列车加速度一致）
  speed-command-accel-factor: 1.0
  # 已废弃，保留仅为兼容旧配置：降速会立即生效，两次调度之间由逐 tick 的限速斜坡沿制动曲线平滑下调
  speed-command-decel-factor: 1.0
  # 最短路距离缓存的刷新周期（秒）
  distance-cache-refresh-seconds: 3
  # 已废弃，保留仅为兼容旧配置：低速恢复改由 health.stall-threshold-seconds 负责
  failover-stall-speed-bps: 0.2
  # 已废弃，保留仅为兼容旧配置
  failover-stall-ticks: 60
  # 目的地不可达时强制停车
  failover-unreachable-stop: true
  # 因闭塞、授权失败或互卡等待而强制停车时，清空 TrainCarts 的目的地与路线，避免旧目标继续牵引列车
  clear-destination-on-hard-stop: true
  # 是否启用统一的信号约束计算
  signal-envelope-enabled: true
  # 占用变化只做标记，统一在周期检查中处理，避免在占用申请过程中重复控车
  signal-event-coalesce: true
  # 从停车信号恢复为放行前需要连续稳定的周期数
  signal-proceed-stability-ticks: 1
  # 每个 tick 最多计算信号约束的列车数
  max-envelope-builds-per-tick: 50
  # 路径与距离缓存的最大条目数
  path-cache-max-size: 4096
  # 失效排队条目的清理时间（秒）
  stale-queue-entry-ttl-seconds: 30
  # 同向跟车的最小安全间隔（格）
  following-min-clear-blocks: 2
  # 同向跟车的停车余量（格）
  following-stop-margin-blocks: 4

spawn:
  # 是否启用发车：周期性生成发车票，在闭塞允许时从线路指定的车库出车（按表运行的线路按时刻表出票）
  # 关闭后不再出车；/fta depot spawn 的提前出车同样经发车流程出车，也需要开启
  enabled: false
  # 自动发车的检查间隔（ticks）
  tick-interval-ticks: 100
  # 从数据库重新读取公司、运营商、线路与交路配置的间隔（ticks）
  plan-refresh-ticks: 200
  # 每次检查最多新生成的列车数，避免卡顿或刷车；被闭塞挡住的票与折返复用的车不占名额
  max-spawn-per-tick: 1
  # 每次检查最多生成的发车票数量（用于追赶错过的发车时刻）
  max-generate-per-tick: 5
  # 每条交路最多积压的发车票数量，防止长时间堵塞后集中补发
  max-backlog-per-service: 5
  # 发车失败或被闭塞挡住后的重试间隔（ticks）
  retry-delay-ticks: 40
  # 最大重试次数，达到后放弃该发车票
  max-attempts: 10
  # 回库票等待终点待命车超过（线路发车间隔 × 该倍数）秒后，改从车库直接发车；0 表示一直等待待命车
  layover-fallback-multiplier: 2.0
  # 发车票在队列中的最长保留时间（秒），超过后丢弃；0 表示不限
  queued-ticket-max-age-seconds: 7200
  # 等待折返复用的发车票最长保留时间（秒），超过后丢弃；0 表示不限
  pending-layover-max-age-seconds: 7200
  # 全网在网列车数上限：达到后车库不再生成新车（折返复用的车不受限）；0 表示不限。
  # 车太多会让网络拥堵、总运量反而下降，建议按线路实际承载能力设置并观察。
  # 与 reclaim.max-active-trains 不同：本项限制发车，那一项在超限时回收闲置车。
  max-active-trains: 16
  # 拥堵评分中"全网满载"的参考车数，一般与 max-active-trains 相同；0 表示不计全网压力。
  # 调整 max-active-trains 做对比时请保持本项不变，以免同时改变拥堵门控的灵敏度。
  congestion-network-reference-trains: 16
  # 拥堵门控：拥堵评分（0~1）高于 hold 时暂停发车，回落到 release 以下时恢复；hold 应大于 release
  congestion-hold-threshold: 0.58
  congestion-release-threshold: 0.48
  # 按表运行的线路用 /fta depot spawn 提前出下一班时，最多比计划发车提前多少分钟出车；提前出的车在车库股道等候至计划时刻
  early-spawn-max-lead-minutes: 15

# 闲置回收：把闲置过久、生命周期到期或超出全网上限的待命列车送回车库
reclaim:
  # 是否启用闲置回收
  enabled: false
  # 待命列车闲置超过该秒数后回收
  max-idle-seconds: 300
  # 全网在网列车超过该数时，每轮额外回收一列闲置车（与 spawn.max-active-trains 限制发车不同）
  max-active-trains: 50
  # 回收扫描间隔（秒）
  check-interval-seconds: 60
  # 需要回收、有回库线路却一直派不出去的待命车，滞留超过该秒数后直接销毁；终点确实没有回库线路时当场销毁，不等这个时长。
  # 只销毁无乘客、无进行中折返的列车；0 表示不销毁（包括没有回库线路时的当场销毁）
  stranded-destroy-seconds: 300

# 时刻表：录制实测运行时分，编排成时刻表后按表运行（/fta timetable）。
# 各开关默认关闭。启用前请先用 /fta timetable build 查看区间运行时分的离散程度（p90 与中位数之比）：
# 比值大说明同一区间的运行时间不稳定，此时按表运行只会让早到的车空等，建议先改善线路再编表。
timetable:
  # 按表运行总开关。关闭时仍可录制，已发布的时刻表不影响任何列车
  enabled: false
  # 由时刻表接管发车，替代 spawn 的按间隔发车；需同时开启 enabled。
  # 只影响有已发布时刻表的交路，其余交路照常按间隔发车
  spawn-enabled: false
  # 早到列车最多扣留的秒数（安全上限）；早到超过该值直接放行并记录审计，多半是车次匹配有误
  hold-max-seconds: 120
  # 列车与表定车次匹配时允许的最大偏差（秒），超过则不绑定、列车自由运行。
  # 也是车次作废的判据：到点后超过该秒数仍未发出的车次视为取消
  assign-tolerance-seconds: 300
  # 发车侧一次最多补发多长时间内错过的车次（秒），避免服务器长时间停机后集中补发
  max-catch-up-seconds: 300
  # 重新加载已发布时刻表的间隔（秒）；发布或下架后最多等待该时长生效
  reload-interval-seconds: 60
  # 编表时每次车站停车在停站时间（dwell）之外额外计入的秒数，涵盖列车对位刹停与开门延迟。
  # 若实际"到站→发车"总时长与表定明显不符，可按实测调整，修改后需重新编排时刻表
  station-stop-overhead-seconds: 4
  # 晚点追赶：只对已绑定表定车次且确实晚点的列车生效，只会缩短等待，不会让列车更晚。
  # 每趟车结束时日志记录一行 TIMETABLE_TRIP_DELAY，可据此评估追赶效果
  recovery:
    # 晚点列车在中途站的最短停站秒数：停站压缩到刚好赶上表定发车，但不少于该值。
    # 出库后首站、交路起点与终点不压缩；0 表示不压缩
    min-dwell-seconds: 10
    # 晚点列车线路限速放宽的百分比。只放宽明确设置的线路限速（牌子限速或永久限速覆盖）；
    # 默认速度、临时限速、进站限速与信号限速不放宽；0 表示不放宽
    overspeed-percent: 10
    # 晚点达到该秒数才放宽限速，追回到该值以内即恢复
    engage-delay-seconds: 10
  # 录制数据写入数据库的间隔（秒）
  recorder-flush-interval-seconds: 5

train:
  # 默认车种（metro / emu / dmu / diesel_push_pull / electric_loco）：未打车种标签的列车按它控车，
  # 编排时刻表与到站预测也按它计算；修改后需重新编排时刻表
  default-type: metro
  # 各车种的加减速度（格/秒²，1 格按 1 米计）：低速段平均起动加速度与常用制动减速度，不是紧急制动。
  # 实际按首尾柔和的 S 形曲线变化，控车与编表使用同一条曲线
  types:
    # 地铁、轻轨电动车组：站距短、起停频繁
    metro:
      accel-bps2: 1.1
      decel-bps2: 1.2
    # 通勤、市域电动车组
    emu:
      accel-bps2: 0.9
      decel-bps2: 1.0
    # 内燃动车组
    dmu:
      accel-bps2: 0.6
      decel-bps2: 0.9
    # 内燃机车推拉
    diesel_push_pull:
      accel-bps2: 0.35
      decel-bps2: 0.7
    # 电力机车牵引
    electric_loco:
      accel-bps2: 0.5
      decel-bps2: 0.8

storage:
  # 存储后端：sqlite / mysql
  backend: sqlite

  sqlite:
    # 插件数据目录下的 SQLite 文件名
    file: "data/fetarute.sqlite"

  mysql:
    # 数据库地址（主机名或 IP）
    db_address: "127.0.0.1"
    # 数据库端口
    db_port: 3306
    # 数据库名
    db_table: "fetarute_tc"
    # 数据库用户名
    db_username: "fta"
    # 数据库密码
    db_password: "change-me"
    # 表前缀，避免与其他插件冲突
    table_prefix: "fta_"

  # 连接池设置（HikariCP）
  pool:
    # 最大连接数（SQLite 固定为 1）
    maximum-pool-size: 5
    # 获取连接的超时时间（毫秒）
    connection-timeout-ms: 30000
    # 空闲连接的存活时间（毫秒）
    idle-timeout-ms: 600000
    # 连接的最长生命周期（毫秒）
    max-lifetime-ms: 1800000
