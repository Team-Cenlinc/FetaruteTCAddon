# config 版本，请勿修改
config-version: 36

# 语言标签，对应 lang/ 下的文件名
locale: zh_CN

debug:
  # 是否启用插件调试日志
  enabled: false
  # 每分钟最多输出多少条“观察类”调度诊断。
  # 执行器审计、停因生命周期、资源生命周期等事务证据不受此限制，始终逐条输出。
  # 默认 120 适合稳定运行；排查拥堵/死锁时调到 1200~3000，查完记得调回来，否则控制台会按列车数放大。
  observation-budget-per-minute: 120

# Smart Dispatcher / Traffic Control Supervisor 安全隔离
smart-dispatcher:
  # OFF = 不调用智能调度决策器；OBSERVE_ONLY = 只输出 trace；ENFORCE = 允许通过 effect class gate 的动作执行
  mode: OBSERVE_ONLY
  # Phase 1.8 minimal forward planner。默认只观察，不创建 reservation。
  planner:
    enabled: true
    mode: OBSERVE_ONLY
    max-reservation-resources: 4
    # unlock 预约存活多少个 50ms 信号 tick。1200 = 60 秒。
    # 它等的是"被提升优先级的列车真的走出去、把资源让出来"，而实测这个过程中位数 21 秒、p90 66 秒。
    # 旧默认 60（=3 秒）短于它等待的物理过程，恢复层 97% 必然超时失败——改小之前先想清楚这一点。
    reservation-ttl-ticks: 1200
    blocker-snapshot-ttl-ms: 10000
    require-same-direction: true
    allow-reverse: false
    allow-turnback-before-boundary: false
    one-active-reservation-per-cycle: true

# 健康检查与自动修复
health:
  # 是否启用健康监控
  enabled: true
  # 检查间隔（秒）
  check-interval-seconds: 5
  # 是否启用自动修复（false 则只告警不修复）
  auto-fix-enabled: true
  # 列车静止告警阈值（秒）：有 PROCEED 信号但静止超过此时间
  stall-threshold-seconds: 30
  # 进度停滞告警阈值（秒）：进度索引长时间不变
  progress-stuck-threshold-seconds: 60
  # STOP 信号下 progress stuck 的宽限阈值（秒）：用于区分“正常排队”等待与真实异常
  progress-stop-grace-seconds: 60
  # STOP 状态下“互卡解锁”触发阈值（秒）：超过后会优先尝试双车解锁
  deadlock-threshold-seconds: 45
  # 实体列车 destructive cleanup 总开关；兼容保留旧键名，同时控制 confirmed deadlock 与普通长时间停滞 cleanup
  deadlock-destroy-enabled: false
  # STOP 互卡最终销毁阈值（秒）：超过后仍未恢复则销毁互卡对中的稳定 leader；0 表示禁用
  deadlock-destroy-threshold-seconds: 60
  # 同一互卡对销毁兜底冷却（秒），避免连续销毁两车
  deadlock-destroy-cooldown-seconds: 120
  # 空车持续无进展且常规恢复已耗尽后，允许进入 cleanup 候选的阈值（秒）
  stuck-cleanup-threshold-seconds: 600
  # 有玩家乘坐列车的更长保护阈值（秒）；空车候选始终优先于载客候选
  stuck-cleanup-passenger-threshold-seconds: 1800
  # 两次普通 stuck cleanup 尝试之间的全局冷却（秒）；每轮检查最多清理一列车
  stuck-cleanup-cooldown-seconds: 120
  # blocker 快照短暂消失后的 episode 保留宽限（秒）
  deadlock-episode-grace-seconds: 15
  # 进入 confirmed mutual deadlock 前的最短 STOP 静止时间（秒）
  deadlock-min-stop-seconds: 20
  # blocker 快照有效期（秒）：用于识别互相阻塞的列车对
  blocker-snapshot-max-age-seconds: 20
  # 自动修复动作冷却（秒）：避免每轮健康检查都重复触发恢复动作
  recovery-cooldown-seconds: 10
  # 占用超时清理阈值（分钟）
  occupancy-timeout-minutes: 5
  # 是否启用孤儿占用清理（列车已消失但占用未释放）
  orphan-cleanup-enabled: true
  # 是否启用超时占用清理
  timeout-cleanup-enabled: true

graph:
  # 图查询/ETA 默认速度（blocks per second），用于 /fta graph query/path 等诊断命令的估算
  default-speed-blocks-per-second: 8.0
  # 牌子节点寻找轨道锚点的半径（blocks）
  sign-anchor-search-radius: 6
  # switcher 节点寻找轨道锚点的半径（blocks）
  switcher-anchor-search-radius: 2

autostation:
  # 关门提示音（Bukkit Sound enum 或自定义 sound key）
  door-close-sound: "BLOCK_NOTE_BLOCK_BELL"
  # 关门提示音音量
  door-close-sound-volume: 1.0
  # 关门提示音音高
  door-close-sound-pitch: 1.2

runtime:
  # 运行时信号/闭塞监测 tick 间隔
  dispatch-tick-interval-ticks: 50
  # 发车/加速动作节流（ticks），0 表示不节流
  launch-cooldown-ticks: 10

  hud:
    # 双语轮播时中英文的切换周期（ticks，20 ticks = 1 秒）。BossBar、ActionBar、车内 LCD 共用这一个周期，
    # 保证三块显示同时显示同一种语言；只有一种语言的状态仍按各模板自己的 rotate_ticks / page_duration_ticks 轮播。
    language-rotate-ticks: 60
    bossbar:
      # 是否启用“车上 BossBar HUD”
      enabled: true
      # BossBar 刷新间隔（ticks）
      tick-interval-ticks: 10
      # BossBar 标题模板（MiniMessage），留空则使用 default_hud_template.yml
      # 占位符: {label_line} {line} {line_code} {line_name} {line_color} {line_color_tag} {operator}
      #        {company} {company_code} {company_name}
      #        {route_code} {route_id} {route_name} {dest_eor} {dest_eor_code} {dest_eor_lang2}
      #        {dest_eop} {dest_eop_code} {dest_eop_lang2} {current_station} {current_station_code} {current_station_lang2}
      #        {label_next} {next_station} {next_station_code} {next_station_lang2}
      #        {eta_status} {eta_minutes} {speed} {speed_kmh} {speed_bps} {speed_unit}
      #        {signal_status} {signal_aspect} {service_status} {progress} {progress_percent}
      #        {train_name} {layover_wait} {player_carriage_no} {player_carriage_total}
      template: ""
    actionbar:
      # 是否启用“车上 ActionBar HUD”
      enabled: true
      # ActionBar 刷新间隔（ticks）
      tick-interval-ticks: 10
      # ActionBar 模板（MiniMessage），留空则使用 default_hud_template.yml
      # 占位符同 BossBar（见上方），支持 HUD State 分支（如 ARRIVING/TERM_ARRIVING）
      template: ""
    player_display:
      # 是否启用“车上 Scoreboard LCD（player_display）”
      enabled: true
      # Scoreboard 刷新间隔（ticks）
      tick-interval-ticks: 10
      # Scoreboard 模板（YAML + MiniMessage），留空则使用 default_hud_template.yml
      template: ""
  # 占用请求 lookahead 边数
  lookahead-edges: 3
  # 同向跟驰最小空闲边数
  min-clear-edges: 2
  # 尾部保护占用边数：保留整列车身（按估算车长）+ 车尾之后 N 段边；车长未知时保留全部可证明的后向路径
  rear-guard-edges: 1
  # 道岔区联合锁闭范围（向前 N 段边）
  switcher-zone-edges: 3
  # 进站/STOP waypoint approaching 限速（blocks per second）
  approach-speed-bps: 10.0
  # 进库前的限速（blocks per second）
  approach-depot-speed-bps: 5.0
  # 进站限速区（blocks）：沿路径逐节点看，节点离它之后的第一个进站触发点不超过该距离时，从这个节点起按进站限速运行；
  # 区外按车型减速度提前制动至区起点。触发点为车站/车库本体、对应咽喉，以及与本体/咽喉立即相邻的 switcher。
  # 编表与 ETA 的运行曲线用同一判据，改动后需重新 build 时刻表。0 表示不按距离划区
  approach-window-blocks: 96.0
  # 节点到下一个触发点的边数小于等于该值时也划入进站限速区；0 表示禁用边数判据
  approach-window-edges: 0
  # CAUTION 信号速度上限（blocks per second），可被连通分量覆盖
  caution-speed-bps: 10.0
  # 是否启用“提前减速”速度曲线（根据剩余距离与制动能力动态限速）
  speed-curve-enabled: true
  # 速度曲线类型：physics/linear/quadratic/cubic
  speed-curve-type: "physics"
  # 速度曲线放大系数（>1 更激进，<1 更保守）：只作用于阻塞/授权终点的停车曲线；进站区外制动与前方限速边按车型减速度原值计算（与编表同口径）
  speed-curve-factor: 1.0
  # 提前减速缓冲距离（blocks），用于更早开始降速
  speed-curve-early-brake-blocks: 0.0
  # 是否启用移动授权（Movement Authority）：授权距离不足时主动降级信号并压速
  movement-authority-enabled: true
  # STOP 授权安全余量（blocks）：制动距离 + 此余量不足时将强制 STOP
  movement-authority-stop-margin-blocks: 2.0
  # CAUTION 授权安全余量（blocks）：制动距离 + 此余量不足时会降级到更保守信号
  movement-authority-caution-margin-blocks: 8.0
  # 速度命令迟滞（blocks/s）：目标速度变化小于该值时不更新，抑制抖动
  speed-command-hysteresis-bps: 0.15
  # 速度命令增速限幅系数：基于列车 accel（1.0 表示与列车加速度一致）
  speed-command-accel-factor: 1.0
  # 速度命令降速限幅系数：兼容旧配置，已不生效。降低 speedLimit 会立即写入，TrainCarts 在下一物理步直接截速
  # （WaitAcceleration 只管跟车/互斥区，不平滑 speedLimit）；两次调度之间由逐 tick 限速斜坡沿进站/限速制动曲线连续下调
  speed-command-decel-factor: 1.0
  # 最短路距离缓存异步刷新周期（秒）
  distance-cache-refresh-seconds: 3
  # 兼容旧配置：低速恢复已迁移到 health.stall-threshold-seconds，不再由信号 tick 使用
  failover-stall-speed-bps: 0.2
  # 兼容旧配置：不再作为 dispatch tick 重试阈值
  failover-stall-ticks: 60
  # failover：目标不可达时强制停车
  failover-unreachable-stop: true
  # 硬 STOP（闭塞/授权失败/互卡等待）时清空 TrainCarts destination 与 route，避免旧目标继续牵引列车。
  clear-destination-on-hard-stop: true
  # 是否启用统一信号约束 envelope（保留轻量分类/缓存接口，避免靠扩大 lookahead 解决信号抖动）
  signal-envelope-enabled: true
  # 占用事件只标记 dirty，由周期 tick 或 coalesced flush 统一处理，避免 acquire 调用栈内重入控车
  signal-event-coalesce: true
  # STOP 后放宽到 PROCEED 前需要的稳定周期数
  signal-proceed-stability-ticks: 1
  # 每 tick 最多构建 envelope 的列车数量
  max-envelope-builds-per-tick: 50
  # 路径/距离缓存最大条目数
  path-cache-max-size: 4096
  # stale conflict queue entry 清理 TTL（秒）
  stale-queue-entry-ttl-seconds: 30
  # 同向跟驰最小安全间隔（blocks），默认按 min-clear-edges 的保守下限推导
  following-min-clear-blocks: 2
  # 同向跟驰 STOP 余量（blocks）
  following-stop-margin-blocks: 4

spawn:
  # 是否启用“基于线路 baseFrequency 的自动发车”
  # - enabled=false 时仅提供命令手动 /fta depot spawn
  # - enabled=true 时将周期性生成 SpawnTicket，并在闭塞门控允许时从 CRET 指定的 depot 自动 spawn 列车
  enabled: false
  # 自动发车 tick 间隔（ticks）
  tick-interval-ticks: 100
  # 刷新发车计划的间隔（ticks）：会从数据库重新读取 Company/Operator/Line/Route/RouteStop
  plan-refresh-ticks: 200
  # 每次 tick 最多实体化（新生成）的列车数（避免卡主线程/刷车）
  # 只数真正生成的车：被闭塞挡在预检的出库票、折返复用的票都不占名额，每拍都会各试一次
  max-spawn-per-tick: 1
  # 每次 tick 最多生成的票据数量（用于追赶 dueTime；建议与 max-backlog-per-service 配合）
  max-generate-per-tick: 5
  # 每条服务（route）最多积压的票据数量（防止长时间堵塞后爆发性补发）
  max-backlog-per-service: 5
  # spawn 失败/门控阻塞后的重试延迟（ticks）
  retry-delay-ticks: 40
  # spawn 最大重试次数（attempts >= max 时放弃该票据）
  max-attempts: 10
  # Layover 复用降级发车：当 RETURN 票据等待超过 (baselineFreq × layover-fallback-multiplier) 秒后，
  # 从 Depot 直接补发而非继续等待 Layover 列车。设为 0 禁用降级（永远等待 Layover）。
  layover-fallback-multiplier: 2.0
  # 发车队列票据最大保留时间（秒）：超过后丢弃并释放 backlog，0 表示禁用硬清理
  queued-ticket-max-age-seconds: 7200
  # Layover pending 票据最大等待时间（秒）：超过后丢弃并释放 backlog，0 表示禁用硬清理
  pending-layover-max-age-seconds: 7200
  # 【准入控制】全网在网列车数上限：达到后 depot 不再实体化新车（复用 layover 的车不受限）。
  # 0 表示禁用。
  #
  # 这是"拥堵崩溃"的直接对策，实测依据：
  #   5 辆 → 8.00 次到站/车/5分钟；13 辆 → 6.85（总产出峰值 89）；24 辆 → 1.04（总产出 25）。
  # 车队接近翻倍而总产出掉了 72%——系统会一直往网里灌车直到堵死，此前没有任何一道闸门拦得住。
  # 总产出在 13~14 辆附近见顶，故默认 16（留一点余量以便观察真实拐点是否更高）。
  #
  # 注意与 reclaim.max-active-trains 的区别：那个是"出口侧"（超限时回收闲置车），
  # 本项是"入口侧"（超限时不再发新车）。
  max-active-trains: 16
  # 拥挤门控的触发/解除阈值（迟滞），作用于 SMART_SPAWN_CONGESTION_SCORE 里的 score。
  #
  # 这两个数需要按实测分布标定，不要凭感觉改。旧默认 0.72/0.58 在实服从未触发过一次：
  # 14 辆车时最高分只有 0.464，因为评分的三个分量全是"本 route 自己"的局部量，
  # 而且只数 EDGE claim（漏了约一半的 NODE 占用）。
  # 现已补上 NODE 并加入 network 分量，当前默认是据此重估的首版取值。
  #
  # 【2026-09-15 第十八轮实测，82 分钟】分布拿到了，结论是**先别动这两个数**：
  #   score 分布  n=368  中位 0.539  p90 0.634  max 0.697   holding=true 占 58%
  # 也就是说门控确实在工作了（不像旧默认 0.72/0.58 那样从未触发），迟滞也正常
  # ——holding 的分数下界正好落在 release 阈值 0.48 上。
  #
  # 但**不能据此调阈值**，因为分数与它要防的东西对不上：把时间切成 5 分钟窗口、
  # 按线路配对（n=48 个窗口），score 与同窗口到站数的相关系数只有 r=0.133，
  # 而且符号与三分位趋势相反（三分位 32.2 → 30.8 → 27.5 是递减的）。
  # 两边都在噪声里 —— 没有可锚定的产出关联，调数字就是凭感觉。
  #
  # 真正可疑的是**评分本身**，不是阈值：
  #   - 动态范围只有 0.0~0.697，0~1 这把尺子上面三成永远够不到；
  #   - 与吞吐无相关，说明它没在衡量"再灌车就要崩"这件事。
  # 下一步该做的是让 score 可预测吞吐（或换一个能预测的量），而不是挪阈值。
  # 在那之前真正兜底的是上面那道 max-active-trains 硬上限，它不依赖这两个数。
  # 拥堵评分里"全网算满"的参考车数。**默认与 max-active-trains 相等，但它们是两个不同的量**：
  # 本项是"网络装多少车算满"（物理/经验量），max-active-trains 是"我们允许发多少车"（策略量）。
  #
  # 为什么要拆开：networkPressure = 在网车数 / 本参考值，是拥堵评分四分量里权重最高的一项之一。
  # 合用一个数时，把 max-active-trains 从 16 提到 24 会**同时**抬高天花板并把软刹车调钝
  # （分母变大 → networkPressure 从 14/16=0.875 掉到 14/24=0.58），一次改两件事，
  # 密度实验就无法归因到底是"车更多"还是"刹车更松"起的作用。
  #
  # 要扫密度曲线：只动 max-active-trains，本项保持不变，软刹车的灵敏度才是可比的。
  # 设为 0 表示没有全网压力信号，评分退回三分量旧权重。
  congestion-network-reference-trains: 16
  congestion-hold-threshold: 0.58
  congestion-release-threshold: 0.48

# 时刻表：录制实测运行时分 → 编成时刻表 → 按表运行
#
# 这一段的所有开关默认关闭。打开 enabled 之前请先看 /fta timetable build 输出的
# p90/median：那个比值就是"这条线到底有没有稳定的典型运行时分"的判据。
# 比值大意味着同一个区间这次跑 60 秒、下次跑 600 秒——此时任何一份表定时分都是错的，
# 按表运行只会让早到的车在站里空等，晚到的车照样晚，净效果是把运力又压低一截。
# 正确顺序是先把离散度压下来，再编表。
# 闲置回收（出口侧）：待命车闲置超时、生命周期到达上限或全网超限时派 RETURN 票送回车库。
reclaim:
  # 是否启用闲置回收
  enabled: false
  # 待命车闲置多久后触发回收（秒）
  max-idle-seconds: 300
  # 全网在网列车数超过此值时进入压力模式，每轮回收一辆闲置车（与 spawn.max-active-trains 的入口侧准入不同）
  max-active-trains: 50
  # 回收扫描间隔（秒）
  check-interval-seconds: 60
  # 兜底：待命车已经该回收、却一直找不到能从它所在终点出发的 RETURN 线路（典型是直通车滞留在别的运营商的终点），
  # 持续超过此秒数就直接销毁。只销毁没有乘客、也没有进行中折返事务的车。0 表示关闭兜底。
  stranded-destroy-seconds: 1800

timetable:
  # 按表运行总开关。关闭时录制照常可用，已发布的时刻表也只是数据，不影响任何一列车。
  enabled: false
  # 是否由时刻表接管发车出票（替代 spawn 段的 headway 出票）。需要 enabled 一并打开。
  # 打开后，凡是有 PUBLISHED 时刻表的 route，headway 票会被拦下，改由表定时刻出票；
  # 没有时刻表的 route 完全不受影响。
  spawn-enabled: false
  # 早到列车最多被扣留多少秒。
  #
  # 这个数字是安全阀而不是策略参数：它的作用是保证"按表运行"永远不会制造一辆假死车。
  # 运行时还会再被调度层 150 秒的硬上限封顶（发车门锁本身 180 秒就会被回收，
  # 扣留必须先于门锁结束，否则会进入"自己不动、也不再排队"的状态）。
  # 早到幅度超过上限时直接放行并记一条审计——那种情况多半是匹配错了车次，不是真的早到。
  hold-max-seconds: 120
  # 列车与表定车次匹配时允许的最大偏差秒数。
  # 偏差超过它就不绑定，该车自由运行。宁可少绑不可错绑：错绑会让车等一个不属于它的时刻。
  assign-tolerance-seconds: 300
  # 发车侧单次轮询最多回补多长的时间窗口（秒）。
  # 服务器停了一整天再启动时，它保证不会把这一天的车一次性全部补发出来。
  max-catch-up-seconds: 300
  # 重新加载已发布时刻表的间隔（秒）。publish/unpublish 之后最多等这么久生效。
  reload-interval-seconds: 60
  # 编表时车站停车在 dwell 之外多算的秒数。
  # 列车压上站牌后由 TrainCarts 居中刹停（约 3 秒），停稳后 AutoStation 再过 1 秒才开门，dwell 从开门起算，
  # 所以表定发车 = 到站 + dwell + 本值；车站终到的折返同理。车库与区间停车点不加。
  # 2026-09-26 实服 136 次停站实测"压牌→发车"中位 24 秒（dwell 20）。站牌居中明显更快或更慢时按实测改，改完要重新 build。
  station-stop-overhead-seconds: 4
  # 录制结果落库的间隔（秒）。录制本身不落库，封存好的跑车在这个 tick 上批量写入。
  recorder-flush-interval-seconds: 5
  # 时刻表默认时区（如 Asia/Shanghai）。留空使用服务器默认时区。
  # 时刻表存的是"当日秒数"，换算成绝对时间要靠它；改这个值会让全部已发布时刻表整体平移。
  zone: ""

train:
  # 默认车种（metro/emu/dmu/diesel_push_pull/electric_loco）：未打车种标签的车与编表、ETA 的运行曲线都按它算，改动后需重新 build 时刻表
  default-type: metro
  # 各车种加减速（blocks/s²，1 block 按 1 米计）：低速段平均起动加速度与常用制动减速度，不是紧急制动
  types:
    # 地铁/轻轨型电动车组（含 tram-train）：站距短、起停频繁
    metro:
      accel-bps2: 1.1
      decel-bps2: 1.2
    # 通勤/市域电动车组
    emu:
      accel-bps2: 0.9
      decel-bps2: 1.0
    # 内燃动车组
    dmu:
      accel-bps2: 0.6
      decel-bps2: 0.9
    # 内燃机车推拉
    diesel_push_pull:
      accel-bps2: 0.35
      decel-bps2: 0.7
    # 电力机车牵引
    electric_loco:
      accel-bps2: 0.5
      decel-bps2: 0.8

storage:
  # 可选值：sqlite / mysql
  backend: sqlite

  sqlite:
    # 插件数据目录下的 SQLite 文件名
    file: "data/fetarute.sqlite"

  mysql:
    # 数据库地址，含主机/IP
    db_address: "127.0.0.1"
    # 数据库端口
    db_port: 3306
    # 数据库名/Schema
    db_table: "fetarute_tc"
    # 数据库用户名
    db_username: "fta"
    # 数据库密码
    db_password: "change-me"
    # 可选：表前缀，避免与其他插件冲突
    table_prefix: "fta_"

  # 连接池设置（HikariCP）
  pool:
    # 最大连接数（SQLite 会自动收敛为 1）
    maximum-pool-size: 5
    # 连接获取超时（毫秒）
    connection-timeout-ms: 30000
    # 空闲连接存活时间（毫秒）
    idle-timeout-ms: 600000
    # 连接最大生命周期（毫秒）
    max-lifetime-ms: 1800000
